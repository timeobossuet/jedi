<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --jedi-red-50: #fff1f2;
  --jedi-red-100: #ffe4e6;
  --jedi-red-200: #fecdd3;
  --jedi-red-300: #fda4af;
  --jedi-red-400: #fb7185;
  --jedi-red-500: #ef4444;
  --jedi-red-600: #dc2626;
  --jedi-red-700: #b91c1c;
  --jedi-red-800: #991b1b;
  --jedi-gray-50: #f9fafb;
  --jedi-gray-100: #f3f4f6;
  --jedi-gray-200: #e5e7eb;
  --jedi-gray-700: #374151;
  --jedi-ink: #111827;
  --jedi-card-shadow: 0 18px 42px -30px rgba(17, 24, 39, 0.5);
}

body,
body.bg-gray-50 {
  font-family: 'Sora', 'Segoe UI', sans-serif !important;
  color: var(--jedi-ink);
  background:
    radial-gradient(circle at 14% -6%, rgba(239, 68, 68, 0.15), transparent 34%),
    radial-gradient(circle at 90% 0%, rgba(156, 163, 175, 0.2), transparent 30%),
    linear-gradient(180deg, #fcfcfd 0%, #f3f4f6 100%);
  background-attachment: fixed;
  color: var(--jedi-ink) !important;
  background-color: transparent !important;
}

h1, h2, h3, h4 {
  font-family: 'Space Grotesk', 'Sora', sans-serif;
  letter-spacing: -0.01em;
}

#view-membres,
#view-reunions,
#view-votes {
  animation: jediFadeUp .45s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes jediFadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── SIDEBAR NAV ─── */
.nav-sg-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: #64748b;
  cursor: pointer;
  transition: background .15s, color .15s, transform .15s;
  text-decoration: none;
}

.nav-sg-item:hover {
  background: #f3f4f6;
  color: #374151;
  transform: translateX(2px);
}

.nav-sg-item.active {
  background: linear-gradient(90deg, rgba(220, 38, 38, 0.18), rgba(220, 38, 38, 0.08));
  color: var(--jedi-red-700);
  font-weight: 700;
}

/* ─── FILTRES MEMBRES ─── */
.filtre-btn {
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  border: 1.5px solid #e2e8f0;
  color: #64748b;
  background: #fff;
  cursor: pointer;
  transition: all .15s;
}

.filtre-btn.active {
  background: var(--jedi-red-600);
  color: #fff;
  border-color: var(--jedi-red-600);
}

.filtre-btn:hover:not(.active) {
  background: #f8fafc;
  border-color: #cbd5e1;
}

/* ─── BADGES STATUT ─── */
.badge-actif        { background: #fee2e2; color: #b91c1c; }
.badge-intervenant  { background: #f3f4f6; color: #4b5563; }
.badge-ancien       { background: #f3f4f6; color: #6b7280; }
.badge-planifie     { background: #ffe4e6; color: #be123c; }
.badge-en-cours     { background: #dcfce7; color: #15803d; }
.badge-termine      { background: #f3f4f6; color: #6b7280; }
.badge-annule       { background: #fee2e2; color: #dc2626; }

/* ─── UTILS THEME (VIOLET/INDIGO -> ROUGE) ─── */
.text-violet-300,
.text-violet-400,
.text-violet-500,
.text-violet-600,
.text-violet-700,
.text-indigo-500,
.text-indigo-600,
.text-indigo-700 {
  color: var(--jedi-red-600) !important;
}

.bg-violet-50,
.hover\:bg-violet-50:hover,
.bg-indigo-50,
.hover\:bg-indigo-50:hover {
  background-color: var(--jedi-red-50) !important;
}

.bg-violet-100,
.bg-indigo-100 {
  background-color: var(--jedi-red-100) !important;
}

.bg-violet-600,
.hover\:bg-violet-600:hover,
.bg-indigo-600,
.hover\:bg-indigo-600:hover {
  background-color: var(--jedi-red-600) !important;
}

.hover\:bg-violet-700:hover,
.hover\:bg-indigo-700:hover {
  background-color: var(--jedi-red-700) !important;
}

.border-violet-100,
.border-violet-200,
.border-indigo-100,
.border-indigo-200 {
  border-color: var(--jedi-red-200) !important;
}

.focus\:ring-violet-400:focus,
.focus\:ring-indigo-400:focus {
  border-color: var(--jedi-red-500) !important;
  box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.18) !important;
  outline: none;
}

/* ─── CHECKLIST ─── */
.checklist-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all .2s;
}

.checklist-dot.done { background: #22c55e; color: #fff; }
.checklist-dot.pending { background: #e5e7eb; color: #9ca3af; }

.checklist-item {
  transition: background .15s;
  border-radius: 8px;
}

.checklist-item.done { opacity: .75; }
.checklist-item:hover { background: #f9fafb !important; }

/* ─── ODJ ─── */
.odj-item {
  animation: fadeSlideIn .2s ease-out;
  border-radius: 10px;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── CARTES RÉUNION ─── */
.reunion-card {
  transition: transform .15s, box-shadow .15s;
}

.reunion-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px -24px rgba(127, 29, 29, .45);
}

.bg-white.rounded-xl,
.bg-white.rounded-lg,
.bg-white.rounded-md {
  border-color: rgba(17, 24, 39, 0.08) !important;
  box-shadow: var(--jedi-card-shadow);
}

/* ─── VOTES — Quorum ─── */
.quorum-ok {
  background: #f0fdf4;
  color: #15803d;
  border-color: #86efac;
}

.quorum-ko {
  background: #fef2f2;
  color: #dc2626;
  border-color: #fca5a5;
}

.quorum-na {
  background: #f8fafc;
  color: #94a3b8;
  border-color: #e2e8f0;
}

/* ─── VOTES — Résultats ─── */
.vote-adopte  { background: #f0fdf4; color: #15803d; border-color: #86efac; }
.vote-rejete  { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }
.vote-quorum  { background: #ffe4e6; color: #be123c; border-color: #fecdd3; }
.vote-attente { background: #f8fafc; color: #64748b; border-color: #e2e8f0; }

/* ─── VOTES — Tableau ─── */
#votes-list > div { border-bottom: 1px solid #f1f5f9; transition: background .1s; }
#votes-list > div:last-child { border-bottom: none; }
#votes-list > div:hover { background: #fafafa; }

/* ─── BALOTILO ─── */
.balotilo-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #fff7ed;
  color: #c2410c;
  border: 1px solid #fed7aa;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
}

/* ─── AG SPECIFIQUE ─── */
.ag-checklist-item { border-left: 3px solid #f59e0b; }
.ag-checklist-item.done { border-left-color: #22c55e; }

/* ─── LOADING SPINNER ─── */
.loading-spinner {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  color: #94a3b8;
}

.loading-spinner i { animation: spin .8s linear infinite; font-size: 24px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── MODALS ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, .45);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, .15);
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalIn .2s ease-out;
}

.modal-box-lg { max-width: 800px; }

@keyframes modalIn {
  from { opacity: 0; transform: scale(.97) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .nav-sg-item { padding: 8px 12px; font-size: 13px; }
  .modal-box { max-width: 100%; margin: 0; border-radius: 16px 16px 0 0; max-height: 95vh; }
  body { background-attachment: scroll; }
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #f8fafc; border-radius: 3px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
