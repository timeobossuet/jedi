        function toLocalDateTimeInputValue_(dateObj) {
            const d = dateObj instanceof Date ? dateObj : new Date(dateObj || Date.now());
            if (!(d instanceof Date) || isNaN(d.getTime())) return '';
            const pad = function(v) { return String(v).padStart(2, '0'); };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function parseDateFromLocalInput_(value) {
            const raw = String(value || '').trim();
            if (!raw) return null;
            const d = new Date(raw);
            if (!(d instanceof Date) || isNaN(d.getTime())) return null;
            return d;
        }

        function parseJsonObjectSafe_(value, fallback) {
            const fb = (fallback && typeof fallback === 'object') ? fallback : {};
            if (value && typeof value === 'object' && !Array.isArray(value)) {
                return value;
            }
            if (typeof value === 'string' && value.trim()) {
                try {
                    const parsed = JSON.parse(value);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                        return parsed;
                    }
                } catch (e) {}
            }
            return fb;
        }

        function formatMeetingDateLabel_(value) {
            const d = value instanceof Date ? value : new Date(value || '');
            if (!(d instanceof Date) || isNaN(d.getTime())) return 'Date non renseignée';
            return d.toLocaleString('fr-FR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function generateMeetingEntryId_() {
            return 'meeting_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        }

        function escapeHtmlAttr(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function stripHtmlTags(value) {
            return String(value || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function stringifyErrorValue_(value) {
            if (value === null || value === undefined) return '';
            if (value instanceof Error) {
                return value.stack || value.message || String(value);
            }
            if (typeof value === 'object') {
                try {
                    return JSON.stringify(value);
                } catch (e) {
                    return String(value);
                }
            }
            return String(value);
        }

        function pushClientErrorLog_(level, message, location) {
            const entry = {
                at: new Date().toISOString(),
                level: String(level || 'info'),
                message: String(message || '').slice(0, 500),
                location: String(location || '').slice(0, 200)
            };

            clientErrorLogs.push(entry);
            if (clientErrorLogs.length > CLIENT_ERROR_LOG_LIMIT) {
                clientErrorLogs = clientErrorLogs.slice(clientErrorLogs.length - CLIENT_ERROR_LOG_LIMIT);
            }
        }

        function normalizeErrorObject_(errorLike) {
            if (errorLike instanceof Error) {
                return {
                    message: errorLike.message || String(errorLike),
                    stack: errorLike.stack || ''
                };
            }

            if (errorLike && typeof errorLike === 'object') {
                return {
                    message: errorLike.message ? String(errorLike.message) : stringifyErrorValue_(errorLike),
                    stack: errorLike.stack ? String(errorLike.stack) : ''
                };
            }

            return {
                message: String(errorLike || 'Erreur inconnue'),
                stack: ''
            };
        }

        function buildErrorFingerprint_(payload) {
            if (!payload || typeof payload !== 'object') return 'unknown';
            return [payload.page || '', payload.location || '', payload.source || '', payload.message || ''].join('|').toLowerCase();
        }

        function shouldThrottleErrorDialog_(fingerprint) {
            const now = Date.now();
            if (fingerprint && fingerprint === lastErrorDialogFingerprint && (now - lastErrorDialogAt) < ERROR_DIALOG_COOLDOWN_MS) {
                return true;
            }
            lastErrorDialogFingerprint = fingerprint;
            lastErrorDialogAt = now;
            return false;
        }

        function buildDsiTicketPayload_(errorLike, meta) {
            const normalizedError = normalizeErrorObject_(errorLike);
            const options = meta && typeof meta === 'object' ? meta : {};
            const payload = {
                page: APP_PAGE_KEY,
                pageTitle: document.title || '',
                source: options.source || 'frontend',
                location: options.location || '',
                url: window.location.href,
                message: normalizedError.message || 'Erreur inconnue',
                stack: normalizedError.stack || '',
                userMessage: options.userMessage || '',
                userAgent: navigator.userAgent || '',
                build: window.__JEDI_ETUDES_BUILD__ || '',
                currentStudyId: currentStudyId || '',
                currentTab: currentTab || '',
                logs: clientErrorLogs.slice(-25),
                occurredAt: new Date().toISOString()
            };

            if (options.extra && typeof options.extra === 'object') {
                payload.extra = options.extra;
            }

            return payload;
        }

        function envoyerTicketDsi_(ticketPayload) {
            return new Promise(function(resolve) {
                google.script.run
                    .withSuccessHandler(function(result) {
                        const safeResult = result && typeof result === 'object' ? result : {};
                        resolve(safeResult);
                    })
                    .withFailureHandler(function(err) {
                        const normalized = normalizeErrorObject_(err);
                        resolve({
                            success: false,
                            error: normalized.message || 'Erreur inconnue',
                            chatUrl: DSI_CHAT_URL,
                            ticketsUrl: DSI_TICKETS_URL
                        });
                    })
                    .signalerErreurDsi(ticketPayload || {});
            });
        }

        function handleUiError_(errorLike, meta) {
            const options = meta && typeof meta === 'object' ? meta : {};
            const payload = options.ticketPayload || buildDsiTicketPayload_(errorLike, options);
            const fingerprint = buildErrorFingerprint_(payload);

            pushClientErrorLog_('error', payload.message || 'Erreur inconnue', payload.location || options.location || '');

            if (options.silent) return;
            if (shouldThrottleErrorDialog_(fingerprint)) return;

            const uiMessage = options.userMessage
                ? escapeHtml(options.userMessage)
                : escapeHtml(payload.message || 'Une erreur technique est survenue.');
            const locationLabel = escapeHtml(payload.location || 'Non précisé');

            const detailsHtml =
                '<div class="space-y-3">' +
                    '<p>' + uiMessage + '</p>' +
                    '<div class="text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-lg p-3">' +
                        '<div><strong>Page :</strong> ' + escapeHtml(payload.page || APP_PAGE_KEY) + '</div>' +
                        '<div><strong>Zone :</strong> ' + locationLabel + '</div>' +
                    '</div>' +
                    '<p class="text-xs text-gray-500">Tu peux envoyer un ticket détaillé au DSI en un clic.</p>' +
                '</div>';

            jAlert(detailsHtml, 'Erreur technique', 'danger', {
                ticketPayload: payload,
                userMessage: options.userMessage || payload.message,
                location: payload.location || options.location || 'ui',
                source: options.source || payload.source || 'frontend',
                error: errorLike
            });
        }

        function handleGasFailure_(location, userMessage, extraMeta) {
            return function(err) {
                const meta = Object.assign({
                    source: 'google.script.run',
                    location: location || '',
                    userMessage: userMessage || ''
                }, extraMeta || {});
                handleUiError_(err, meta);
            };
        }

        function installGlobalErrorHandlers_() {
            if (window.__JEDI_GLOBAL_ERROR_HANDLERS_INSTALLED__) return;
            window.__JEDI_GLOBAL_ERROR_HANDLERS_INSTALLED__ = true;

            window.addEventListener('error', function(event) {
                if (!event) return;
                const msg = String(event.message || 'Erreur JavaScript');
                if (/ResizeObserver loop limit exceeded/i.test(msg)) return;

                const location = [event.filename || '', event.lineno || '', event.colno || '']
                    .filter(Boolean)
                    .join(':');
                const err = event.error || new Error(msg);

                handleUiError_(err, {
                    source: 'window.onerror',
                    location: location || 'window',
                    userMessage: 'Une erreur JavaScript inattendue est survenue.'
                });
            });

            window.addEventListener('unhandledrejection', function(event) {
                const reason = event && event.reason ? event.reason : 'Promesse rejetée sans gestionnaire';
                handleUiError_(reason, {
                    source: 'window.unhandledrejection',
                    location: 'promise',
                    userMessage: 'Une promesse a échoué sans gestionnaire côté interface.'
                });
            });
        }

        function installAlertOverride_() {
            if (window.__JEDI_ALERT_OVERRIDDEN__) return;
            window.__JEDI_ALERT_OVERRIDDEN__ = true;

            window.__JEDI_NATIVE_ALERT__ = window.alert ? window.alert.bind(window) : null;
            window.alert = function(message) {
                const text = String(message || '');
                const isDanger = /erreur|impossible|echec|échou|failed|exception/i.test(text);
                return jAlert(escapeHtml(text).replace(/\n/g, '<br>'), isDanger ? 'Erreur' : 'Information', isDanger ? 'danger' : 'warning', {
                    source: 'window.alert',
                    location: 'window.alert',
                    userMessage: stripHtmlTags(text),
                    disableDsi: !isDanger
                });
            };
        }

        (function patchConsoleForClientLogs_() {
            if (window.__JEDI_CONSOLE_PATCHED__) return;
            window.__JEDI_CONSOLE_PATCHED__ = true;

            const originalConsole = {
                log: console.log ? console.log.bind(console) : function() {},
                warn: console.warn ? console.warn.bind(console) : function() {},
                error: console.error ? console.error.bind(console) : function() {}
            };

            function capture(level, args) {
                try {
                    const message = Array.prototype.slice.call(args || []).map(stringifyErrorValue_).join(' | ');
                    pushClientErrorLog_(level, message, 'console');
                } catch (e) {}
            }

            console.log = function() {
                capture('log', arguments);
                return originalConsole.log.apply(console, arguments);
            };
            console.warn = function() {
                capture('warn', arguments);
                return originalConsole.warn.apply(console, arguments);
            };
            console.error = function() {
                capture('error', arguments);
                return originalConsole.error.apply(console, arguments);
            };
        })();

        function updateBodyScrollLock() {

                (clientModal && !clientModal.classList.contains('hidden')) ||
                (intervenantModal && !intervenantModal.classList.contains('hidden')) ||
                (diffusionModal && !diffusionModal.classList.contains('hidden')) ||
                (phaseEditorModal && !phaseEditorModal.classList.contains('hidden')) ||
                (meetingHistoryModal && !meetingHistoryModal.classList.contains('hidden'));
            document.body.classList.toggle('overflow-hidden', !!anyOpen);
        }

        function createEmptyClientContact() {
            return { civility: '', lastName: '', firstName: '', email: '', position: '', phone: '' };
        }

        function getDefaultClientInfo() {
            return {
                type: 'Entreprise',
                name: '',
                description: '',
                capitalSocial: 0,
                address: '',
                postalCode: '',
                city: '',
                particulier: { civility: '', firstName: '', lastName: '', email: '', phone: '' },
                contacts: [createEmptyClientContact()]
            };
        }

        function normalizeClientInfo(raw) {
            const base = getDefaultClientInfo();
            if (!raw || typeof raw !== 'object') return base;

            const normalized = {
                type: raw.type || base.type,
                name: raw.name || '',
                description: raw.description || '',
                capitalSocial: Number.isFinite(parseFloat(raw.capitalSocial)) ? parseFloat(raw.capitalSocial) : 0,
                address: raw.address || '',
                postalCode: raw.postalCode || '',
                city: raw.city || '',
                particulier: {
                    civility: raw.particulier && raw.particulier.civility ? raw.particulier.civility : '',
                    firstName: raw.particulier && raw.particulier.firstName ? raw.particulier.firstName : '',
                    lastName: raw.particulier && raw.particulier.lastName ? raw.particulier.lastName : '',
                    email: raw.particulier && raw.particulier.email ? raw.particulier.email : '',
                    phone: raw.particulier && raw.particulier.phone ? raw.particulier.phone : ''
                },
                contacts: Array.isArray(raw.contacts) ? raw.contacts.map(c => ({
                    civility: c && c.civility ? c.civility : '',
                    lastName: c && c.lastName ? c.lastName : '',
                    firstName: c && c.firstName ? c.firstName : '',
                    email: c && c.email ? c.email : '',
                    position: c && c.position ? c.position : '',
                    phone: c && c.phone ? c.phone : '',
                    isSignatory: c && !!c.isSignatory
                })) : []
            };

            if (normalized.type !== 'Particulier' && normalized.contacts.length === 0) {
                normalized.contacts = [createEmptyClientContact()];
            }
            return normalized;
        }

        function escapeHtml(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getStudiesListCache_() {
            try {
                const raw = sessionStorage.getItem('studies_list_cache_v1');
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.studies)) return null;
                return parsed;
            } catch (e) {
                return null;
            }
        }

        function setStudiesListCache_(studies) {
            try {
                sessionStorage.setItem('studies_list_cache_v1', JSON.stringify({
                    studies: Array.isArray(studies) ? studies : [],
                    cachedAt: new Date().toISOString()
                }));
            } catch (e) {}
        }

        function getStudyOverviewCache_(studyId) {
            try {
                const raw = sessionStorage.getItem('study_overview_' + String(studyId));
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function setStudyOverviewCache_(studyId, updatedAt, payload) {
            try {
                sessionStorage.setItem('study_overview_' + String(studyId), JSON.stringify({
                    updatedAt: updatedAt || '',
                    payload: payload || {},
                    cachedAt: new Date().toISOString()
                }));
            } catch (e) {}
        }

        function normalizeEtudeCategories(raw) {
            let values = [];
            if (Array.isArray(raw)) {
                values = raw;
            } else if (typeof raw === 'string') {
                values = raw.split(',');
            } else if (raw !== null && raw !== undefined) {
                values = [String(raw)];
            }

            const seen = new Set();
            const normalized = [];
            values.forEach(function(value) {
                const cat = String(value || '').trim();
                if (!cat) return;
                const key = cat.toLowerCase();
                if (seen.has(key)) return;
                seen.add(key);
                normalized.push(cat);
            });
            return normalized;
        }

        function getCurrentEtudeCategories() {
            return normalizeEtudeCategories(currentEtudeData.categories || currentEtudeData.categorie || []);
        }

        function normalizeDiffusionEmails_(raw) {
            const values = Array.isArray(raw) ? raw : [];
            const seen = new Set();
            const out = [];

            values.forEach(function(value) {
                const email = String(value || '').trim().toLowerCase();
                if (!email || !email.includes('@') || seen.has(email)) return;
                seen.add(email);
                out.push(email);
            });

            return out;
        }

        function getCurrentDiffusionSelections_() {
            const rawSelections = Array.isArray(currentEtudeData.diffusionLists) ? currentEtudeData.diffusionLists : [];
            if (rawSelections.length > 0 && typeof rawSelections[0] === 'object') {
                return rawSelections
                    .map(function(item) {
                        return {
                            label: String(item && item.label ? item.label : '').trim(),
                            email: String(item && item.email ? item.email : '').trim().toLowerCase()
                        };
                    })
                    .filter(function(item) { return item.label && item.email; });
            }

            const selectedEmails = normalizeDiffusionEmails_(currentEtudeData.diffusionListEmails || []);
            if (selectedEmails.length === 0) return [];

            return DIFFUSION_LIST_OPTIONS
                .filter(function(option) { return selectedEmails.indexOf(String(option.email).toLowerCase()) >= 0; })
                .map(function(option) { return { label: option.label, email: String(option.email).toLowerCase() }; });
        }

        function getCurrentDiffusionRecipientEmails_() {
            const fromSelections = getCurrentDiffusionSelections_().map(function(item) { return item.email; });
            const fallback = normalizeDiffusionEmails_(currentEtudeData.diffusionListEmails || []);
            return normalizeDiffusionEmails_(fromSelections.length ? fromSelections : fallback);
        }

        function renderDiffusionListsSummary() {
            const summaryEl = document.getElementById('diffusion-lists-summary');
            if (!summaryEl) return;

            const selected = getCurrentDiffusionSelections_();
            if (!selected.length) {
                summaryEl.textContent = 'Aucune liste sélectionnée';
                return;
            }

            if (selected.length === 1) {
                summaryEl.textContent = '1 liste sélectionnée : ' + selected[0].label;
                return;
            }

            summaryEl.textContent = selected.length + ' listes sélectionnées';
        }

        function renderDiffusionListsModal() {
            const optionsEl = document.getElementById('diffusion-lists-options');
            if (!optionsEl) return;

            const selectedKeys = new Set(getCurrentDiffusionSelections_().map(function(item) {
                return item.label + '|' + item.email;
            }));

            optionsEl.innerHTML = DIFFUSION_LIST_OPTIONS.map(function(option, idx) {
                const email = String(option.email || '').toLowerCase();
                const key = option.label + '|' + email;
                const checked = selectedKeys.has(key) ? 'checked' : '';
                return `
                    <label class="flex items-start gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                        <input type="checkbox" class="mt-1 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" data-diffusion-index="${idx}" ${checked}>
                        <span>
                            <span class="block text-sm font-medium text-gray-800">${escapeHtml(option.label)}</span>
                            <span class="block text-xs text-gray-500">${escapeHtml(option.email)}</span>
                        </span>
                    </label>
                `;
            }).join('');
        }

        function openDiffusionListsModal() {
            const modal = document.getElementById('diffusion-lists-modal');
            if (!modal) return;
            renderDiffusionListsModal();
            modal.classList.remove('hidden');
            updateBodyScrollLock();
        }

        function closeDiffusionListsModal() {
            const modal = document.getElementById('diffusion-lists-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            updateBodyScrollLock();
        }

        function saveDiffusionLists() {
            const optionsEl = document.getElementById('diffusion-lists-options');
            if (!optionsEl) return;

            const checked = Array.from(optionsEl.querySelectorAll('input[data-diffusion-index]:checked'));
            const selections = checked
                .map(function(input) {
                    const idx = Number(input.dataset.diffusionIndex);
                    const option = DIFFUSION_LIST_OPTIONS[idx];
                    if (!option) return null;
                    return { label: option.label, email: String(option.email || '').toLowerCase() };
                })
                .filter(Boolean);

            currentEtudeData.diffusionLists = selections;
            currentEtudeData.diffusionListEmails = normalizeDiffusionEmails_(selections.map(function(item) { return item.email; }));

            saveEtudeInfo();
            renderDiffusionListsSummary();
            closeDiffusionListsModal();
        }

        function renderEtudeCategories() {
            const listEl = document.getElementById('etude-categories-list');
            const optionsEl = document.getElementById('etude-categories-options');
            if (!listEl || !optionsEl) return;

            const categories = getCurrentEtudeCategories();

            listEl.innerHTML = categories.map((cat, index) => `
                <span class="inline-flex items-center bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-full px-3 py-1 text-sm">
                    ${escapeHtml(cat)}
                    <button type="button" class="ml-2 text-indigo-500 hover:text-indigo-700" onclick="supprimerCategorieEtude(${index})">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');

            const merged = Array.from(new Set([...(existingEtudeCategories || []), ...categories]));
            optionsEl.innerHTML = merged
                .sort((a, b) => a.localeCompare(b, 'fr'))
                .map(cat => `<option value="${escapeHtml(cat)}"></option>`)
                .join('');
        }

        function loadExistingEtudeCategories(forceReload) {
            if (!forceReload && Array.isArray(existingEtudeCategories) && existingEtudeCategories.length > 0) {
                renderEtudeCategories();
                return;
            }

            google.script.run
                .withSuccessHandler(function(categories) {
                    existingEtudeCategories = Array.isArray(categories) ? normalizeEtudeCategories(categories) : [];
                    renderEtudeCategories();
                })
                .withFailureHandler(function(err) {
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'listerCategoriesEtudesFirestore',
                        userMessage: 'Impossible de charger les catégories d\'étude.',
                        silent: true
                    });
                    existingEtudeCategories = [];
                    renderEtudeCategories();
                })
                .listerCategoriesEtudesFirestore();
        }

        function addEtudeCategory() {
            const input = document.getElementById('etude-categorie-input');
            if (!input) return;
            const value = String(input.value || '').trim();
            if (!value) return;

            const categories = getCurrentEtudeCategories();
            categories.push(value);

            currentEtudeData.categories = normalizeEtudeCategories(categories);
            currentEtudeData.categorie = currentEtudeData.categories.join(', ');

            input.value = '';
            renderEtudeCategories();
            saveEtudeInfo();
        }

        function removeEtudeCategory(index) {
            const categories = getCurrentEtudeCategories();
            categories.splice(index, 1);

            currentEtudeData.categories = normalizeEtudeCategories(categories);
            currentEtudeData.categorie = currentEtudeData.categories.join(', ');

            renderEtudeCategories();
            saveEtudeInfo();
        }

        function updateStudyName(value) {
            if (!currentStudyId) return;
            const cleanName = String(value || '').replace(/\s+/g, ' ').trim();
            if (!cleanName) {
                jAlert("Le titre de l'étude ne peut pas être vide.", 'Information', 'warning');
                const input = document.getElementById('etude-titre');
                if (input) input.value = currentEtudeData.nom || document.getElementById('etude-name').textContent || '';
                return;
            }

            google.script.run
                .withSuccessHandler(function(result) {
                    if (!result || !result.success) {
                        jAlert('Impossible de renommer l\'étude.', 'Erreur', 'danger');
                        return;
                    }

                    currentEtudeData.nom = result.name;
                    currentEtudeData.reference = result.reference;
                    document.getElementById('etude-name').textContent = result.name;
                    document.getElementById('etude-ref').textContent = result.reference;

                    const driveLink = document.getElementById('etude-drive-link');
                    if (driveLink && result.url) driveLink.href = result.url;

                    const titleInput = document.getElementById('etude-titre');
                    if (titleInput) titleInput.value = result.name;

                    const idx = studiesData.findIndex(s => s.id === currentStudyId);
                    if (idx >= 0) {
                        studiesData[idx].name = result.name;
                        studiesData[idx].fullRef = result.reference;
                    }

                    renderStudiesTable(studiesData);
                })
                .withFailureHandler(function(err) {
                    jAlert('Erreur renommage étude : ' + (err && err.message ? err.message : err), 'Erreur', 'danger');
                })
                .renameStudyAndSyncName(currentStudyId, cleanName);
        }

        function openPlanningModal() {
            const modal = document.getElementById('planning-modal');
            if (!modal) return;
            modal.classList.remove('hidden');
            updateBodyScrollLock();
            renderPlanning();
        }

        function normalizeMeetingEntry_(raw, index) {
            const item = raw && typeof raw === 'object' ? raw : {};
            const id = String(item.id || '').trim() || ('meeting_' + index + '_' + Date.now());
            const startIso = String(item.startIso || item.dateIso || '').trim();
            const d = startIso ? new Date(startIso) : null;
            const safeIso = d && !isNaN(d.getTime()) ? d.toISOString() : '';
            const duration = Math.max(15, parseInt(item.durationMinutes, 10) || 60);
            const format = String(item.format || (item.withMeet ? 'meet' : 'physique')).toLowerCase() === 'physique' ? 'physique' : 'meet';
            const statusRaw = String(item.status || '').toLowerCase();
            const status = (statusRaw === 'realisee' || statusRaw === 'annulee' || statusRaw === 'planifiee') ? statusRaw : 'planifiee';
            return {
                id: id,
                startIso: safeIso,
                durationMinutes: duration,
                format: format,
                status: status,
                tag: String(item.tag || '').trim(),
                title: String(item.title || '').trim(),
                includeClient: item.includeClient !== false,
                includeIntervenant: !!item.includeIntervenant,
                location: String(item.location || '').trim(),
                meetingLink: String(item.meetingLink || '').trim(),
                eventUrl: String(item.eventUrl || '').trim(),
                crFileId: String(item.crFileId || '').trim(),
                crFileUrl: String(item.crFileUrl || '').trim(),
                crFileName: String(item.crFileName || '').trim(),
                notes: String(item.notes || '').trim(),
                origin: String(item.origin || 'manual').trim() || 'manual',
                createdAt: String(item.createdAt || '').trim() || new Date().toISOString(),
                updatedAt: String(item.updatedAt || '').trim() || new Date().toISOString()
            };
        }

        function loadMeetingHistoryFromEtude_() {
            const raw = Array.isArray(currentEtudeData.meetingHistory) ? currentEtudeData.meetingHistory : [];
            meetingHistoryEntries = raw.map(function(item, index) {
                return normalizeMeetingEntry_(item, index);
            });
            sortMeetingHistory_();
        }

        function sortMeetingHistory_() {
            meetingHistoryEntries.sort(function(a, b) {
                const ta = a.startIso ? new Date(a.startIso).getTime() : 0;
                const tb = b.startIso ? new Date(b.startIso).getTime() : 0;
                return tb - ta;
            });
        }

        function queueSaveMeetingHistory_() {
            if (!currentStudyId) return;
            clearTimeout(meetingHistorySaveTimer);
            meetingHistorySaveTimer = setTimeout(saveMeetingHistoryNow_, 3000);
        }

        function saveMeetingHistoryNow_() {
            if (!currentStudyId) return;
            currentEtudeData.meetingHistory = meetingHistoryEntries.map(function(item, index) {
                return normalizeMeetingEntry_(item, index);
            });
            saveEtudeInfo();
        }

        function getMeetingStatusLabel_(status) {
            if (status === 'realisee') return 'Réalisée';
            if (status === 'annulee') return 'Annulée';
            return 'Planifiée';
        }

        function getMeetingFormatLabel_(format) {
            return format === 'physique' ? 'Physique' : 'Meet';
        }

        function renderMeetingHistoryTable_() {
            const tbody = document.getElementById('meeting-history-table-body');
            if (!tbody) return;

            if (!meetingHistoryEntries.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-gray-400">Aucune réunion enregistrée pour cette étude.</td></tr>';
                return;
            }

            tbody.innerHTML = meetingHistoryEntries.map(function(entry) {
                const dateLabel = escapeHtml(formatMeetingDateLabel_(entry.startIso));
                const statusLabel = escapeHtml(getMeetingStatusLabel_(entry.status));
                const formatLabel = escapeHtml(getMeetingFormatLabel_(entry.format));
                const participants = [entry.includeClient ? 'Client' : '', entry.includeIntervenant ? 'Intervenant' : '']
                    .filter(Boolean)
                    .join(' + ') || 'Aucun';
                const place = entry.format === 'physique'
                    ? (entry.location || '(lieu non renseigné)')
                    : (entry.meetingLink || '(lien non renseigné)');

                return `
                    <tr class="border-b border-gray-100 align-top">
                        <td class="py-2 pr-3">${dateLabel}</td>
                        <td class="py-2 pr-3">${formatLabel}</td>
                        <td class="py-2 pr-3">${escapeHtml(participants)}</td>
                        <td class="py-2 pr-3">${statusLabel}</td>
                        <td class="py-2 pr-3">
                            ${entry.eventUrl ? `<a href="${escapeHtmlAttr(entry.eventUrl)}" target="_blank" rel="noopener noreferrer" class="text-indigo-700 hover:underline">Calendrier</a><br>` : ''}
                            ${entry.meetingLink ? `<a href="${escapeHtmlAttr(entry.meetingLink)}" target="_blank" rel="noopener noreferrer" class="text-indigo-700 hover:underline">Lien réunion</a><br>` : ''}
                            <span class="text-gray-600">${escapeHtml(place)}</span>
                        </td>
                        <td class="py-2 pr-3 text-gray-600">${escapeHtml(entry.notes || '—')}</td>
                        <td class="py-2 whitespace-nowrap">
                            <button onclick="creerOuOuvrirCrReunionHistorique('${escapeHtmlAttr(entry.id)}')" class="text-xs px-2 py-1 border border-indigo-200 text-indigo-700 rounded hover:bg-indigo-50 mr-1">${entry.crFileUrl ? 'Ouvrir CR' : 'Créer CR'}</button>
                            <button onclick="editerReunionHistorique('${escapeHtmlAttr(entry.id)}')" class="text-xs px-2 py-1 border border-gray-300 rounded hover:bg-gray-50 mr-1">Modifier</button>
                            <button onclick="supprimerReunionHistorique('${escapeHtmlAttr(entry.id)}')" class="text-xs px-2 py-1 border border-red-200 text-red-700 rounded hover:bg-red-50">Supprimer</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getLastRealisedMeetingDate_() {
            let last = null;
            meetingHistoryEntries.forEach(function(entry) {
                if (entry.status !== 'realisee') return;
                const d = entry.startIso ? new Date(entry.startIso) : null;
                if (!d || isNaN(d.getTime())) return;
                if (!last || d.getTime() > last.getTime()) last = d;
            });
            return last;
        }

        function renderMeetingInactivityWarning_() {
            const warning = document.getElementById('realisation-followup-warning');
            if (!warning) return;

            const lastRealised = getLastRealisedMeetingDate_();
            if (!lastRealised) {
                warning.classList.remove('hidden');
                warning.innerHTML = '<strong>Attention :</strong> aucune réunion réalisée n\'est enregistrée pour cette étude.';
                return;
            }

            const now = new Date();
            const diffDays = Math.floor((now.getTime() - lastRealised.getTime()) / (1000 * 60 * 60 * 24));
            if (diffDays > MEETING_INACTIVITY_DAYS) {
                warning.classList.remove('hidden');
                warning.innerHTML = '<strong>Attention :</strong> aucune réunion réalisée depuis ' + diffDays + ' jours.';
            } else {
                warning.classList.add('hidden');
            }
        }

        function renderMeetingFollowups_() {
            renderMeetingHistoryTable_();
            renderMeetingInactivityWarning_();
        }

        function ensureDefaultSuiviMeetingDate_() {
            const input = document.getElementById('suivi-meeting-datetime');
            if (!input || input.value) return;
            const d = new Date();
            d.setDate(d.getDate() + 1);
            d.setHours(10, 0, 0, 0);
            input.value = toLocalDateTimeInputValue_(d);
        }

        function setMeetingModalDefaults_() {
            const dt = document.getElementById('meeting-modal-datetime');
            const duration = document.getElementById('meeting-modal-duration');
            const format = document.getElementById('meeting-modal-format');
            const status = document.getElementById('meeting-modal-status');
            const location = document.getElementById('meeting-modal-location');
            const link = document.getElementById('meeting-modal-link');
            const notes = document.getElementById('meeting-modal-notes');
            const client = document.getElementById('meeting-modal-client');
            const interv = document.getElementById('meeting-modal-intervenant');
            const addCal = document.getElementById('meeting-modal-add-calendar');

            const d = new Date();
            d.setDate(d.getDate() + 1);
            d.setHours(10, 0, 0, 0);

            if (dt) dt.value = toLocalDateTimeInputValue_(d);
            if (duration) duration.value = '60';
            if (format) format.value = 'meet';
            if (status) status.value = 'planifiee';
            if (location) location.value = '';
            if (link) link.value = '';
            if (notes) notes.value = '';
            if (client) client.checked = true;
            if (interv) interv.checked = true;
            if (addCal) addCal.checked = true;

            onChangeFormatModalHistoriqueReunion();

            if (saveBtn) saveBtn.dataset.editId = '';
        }

        function openMeetingHistoryModal(context) {
            meetingHistoryModalContext = String(context || 'general');
            const modal = document.getElementById('meeting-history-modal');
            if (!modal) return;
            setMeetingModalDefaults_();

            const client = document.getElementById('meeting-modal-client');
            const intervenant = document.getElementById('meeting-modal-intervenant');
            if (meetingHistoryModalContext === 'avant-projet') {
                if (client) client.checked = true;
                if (intervenant) intervenant.checked = false;
            }

            modal.classList.remove('hidden');
            updateBodyScrollLock();
        }

        function closeMeetingHistoryModal() {
            const modal = document.getElementById('meeting-history-modal');
            if (!modal) return;
            modal.classList.add('hidden');
            updateBodyScrollLock();
        }

        function onChangeFormatModalHistoriqueReunion() {
            const format = document.getElementById('meeting-modal-format');
            const location = document.getElementById('meeting-modal-location');
            if (!format || !location) return;
            const isPhysical = String(format.value || 'meet') === 'physique';
            location.disabled = !isPhysical;
            if (!isPhysical) location.value = '';
        }

        function onChangeFormatSuiviReunion() {
            const format = document.getElementById('suivi-meeting-format');
            const location = document.getElementById('suivi-meeting-location');
            if (!format || !location) return;
            const isPhysical = String(format.value || 'meet') === 'physique';
            location.disabled = !isPhysical;
            if (!isPhysical) location.value = '';
        }

        function collectMeetingFormData_(prefix) {
            const p = String(prefix || 'meeting-modal');
            const dateEl = document.getElementById(p + '-datetime');
            const durationEl = document.getElementById(p + '-duration');
            const formatEl = document.getElementById(p + '-format');
            const locationEl = document.getElementById(p + '-location');
            const notesEl = document.getElementById(p + '-notes');
            const clientEl = document.getElementById(p + '-client');
            const intervEl = document.getElementById(p + '-intervenant');
            const addCalendarEl = document.getElementById(p + '-add-calendar');

            const startDate = parseDateFromLocalInput_(dateEl && dateEl.value);
            if (!startDate) {
                throw new Error('Date de réunion invalide.');
            }

            const duration = Math.max(15, parseInt(durationEl && durationEl.value, 10) || 60);
            const format = (formatEl && String(formatEl.value || '').toLowerCase() === 'physique') ? 'physique' : 'meet';
            const location = String(locationEl && locationEl.value ? locationEl.value : '').trim();
            const notes = String(notesEl && notesEl.value ? notesEl.value : '').trim();
            const includeClient = !!(clientEl && clientEl.checked);
            const includeIntervenant = !!(intervEl && intervEl.checked);
            const addCalendar = !!(addCalendarEl && addCalendarEl.checked);

            return {
                startDate: startDate,
                durationMinutes: duration,
                format: format,
                location: location,
                notes: notes,
                includeClient: includeClient,
                includeIntervenant: includeIntervenant,
                addCalendar: addCalendar
            };
        }

        function buildMeetingEntryFromPayload_(payload, origin, statusOverride) {
            const p = payload && typeof payload === 'object' ? payload : {};
            const nowIso = new Date().toISOString();
            const startIso = p.startIso || '';
            const status = statusOverride || 'planifiee';
            return normalizeMeetingEntry_({
                id: generateMeetingEntryId_(),
                startIso: startIso,
                durationMinutes: p.durationMinutes || 60,
                format: p.withMeet ? 'meet' : 'physique',
                status: status,
                includeClient: p.includeClient,
                includeIntervenant: p.includeIntervenant,
                location: p.location || '',
                meetingLink: p.meetLink || p.meetingLink || '',
                eventUrl: p.eventUrl || '',
                notes: p.notes || '',
                origin: origin || 'manual',
                createdAt: nowIso,
                updatedAt: nowIso
            }, 0);
        }

        function upsertMeetingHistoryEntry_(entry) {
            const e = normalizeMeetingEntry_(entry || {}, 0);
            const idx = meetingHistoryEntries.findIndex(function(item) { return String(item.id) === String(e.id); });
            if (idx >= 0) {
                e.createdAt = meetingHistoryEntries[idx].createdAt || e.createdAt;
                e.updatedAt = new Date().toISOString();
                meetingHistoryEntries[idx] = e;
            } else {
                meetingHistoryEntries.push(e);
            }
            sortMeetingHistory_();
            renderMeetingFollowups_();
            queueSaveMeetingHistory_();
            syncStatusFromProgression_();
        }

        function deleteMeetingHistoryEntry_(entryId) {
            const id = String(entryId || '').trim();
            if (!id) return;
            meetingHistoryEntries = meetingHistoryEntries.filter(function(item) {
                return String(item.id) !== id;
            });
            renderMeetingFollowups_();
            queueSaveMeetingHistory_();
            syncStatusFromProgression_();
        }

        async function deleteMeetingHistoryEntryWithConfirm_(entryId) {
            const ok = await jConfirm(
                'Cette réunion sera supprimée de l\'historique de l\'étude.',
                'Supprimer la réunion ? ',
                { confirmText: 'Supprimer', cancelText: 'Annuler', type: 'warning' }
            );
            if (!ok) return;
            deleteMeetingHistoryEntry_(entryId);
        }

        function openMeetingHistoryEditModal_(entryId) {
            const id = String(entryId || '').trim();
            const entry = meetingHistoryEntries.find(function(item) { return String(item.id) === id; });
            if (!entry) return;

            openMeetingHistoryModal('edit');
            const dt = document.getElementById('meeting-modal-datetime');
            const duration = document.getElementById('meeting-modal-duration');
            const format = document.getElementById('meeting-modal-format');
            const status = document.getElementById('meeting-modal-status');
            const location = document.getElementById('meeting-modal-location');
            const link = document.getElementById('meeting-modal-link');
            const notes = document.getElementById('meeting-modal-notes');
            const client = document.getElementById('meeting-modal-client');
            const interv = document.getElementById('meeting-modal-intervenant');
            const addCal = document.getElementById('meeting-modal-add-calendar');
            const saveBtn = document.getElementById('btn-save-meeting-modal');

            if (dt) dt.value = toLocalDateTimeInputValue_(entry.startIso);
            if (duration) duration.value = String(entry.durationMinutes || 60);
            if (format) format.value = entry.format || 'meet';
            if (status) status.value = entry.status || 'planifiee';
            if (location) location.value = entry.location || '';
            if (link) link.value = entry.meetingLink || '';
            if (notes) notes.value = entry.notes || '';
            if (client) client.checked = !!entry.includeClient;
            if (interv) interv.checked = !!entry.includeIntervenant;
            if (addCal) addCal.checked = false;
            if (saveBtn) saveBtn.dataset.editId = id;

            onChangeFormatModalHistoriqueReunion();

        async function saveMeetingFromHistoryModal() {
            const saveBtn = document.getElementById('btn-save-meeting-modal');
            const editId = saveBtn && saveBtn.dataset ? String(saveBtn.dataset.editId || '').trim() : '';

            let data;
            try {
                data = collectMeetingFormData_('meeting-modal');
            } catch (e) {
                jAlert(e && e.message ? e.message : 'Données de réunion invalides.', 'Erreur', 'warning');
                return;
            }

            const statusEl = document.getElementById('meeting-modal-status');
            const status = statusEl ? String(statusEl.value || 'planifiee') : 'planifiee';
            const linkEl = document.getElementById('meeting-modal-link');
            const manualLink = String(linkEl && linkEl.value ? linkEl.value : '').trim();

            if (!data.includeClient && !data.includeIntervenant) {
                if (data.addCalendar) {
                    jAlert('Sélectionnez au moins un participant (client ou intervenant) pour ajouter la réunion au calendrier.', 'Participants manquants', 'warning');
                    return;
                }
                const ok = await jConfirm(
                    'Aucun participant client/intervenant sélectionné. Continuer quand même ? ',
                    'Participants non sélectionnés',
                    { confirmText: 'Continuer', cancelText: 'Annuler', type: 'warning' }
                );
                if (!ok) return;
            }

            if (data.format === 'physique' && !data.location) {
                jAlert('Renseignez le lieu de la réunion physique.', 'Lieu manquant', 'warning');
                return;
            }

            let payload = {
                success: true,
                startIso: data.startDate.toISOString(),
                durationMinutes: data.durationMinutes,
                withMeet: data.format === 'meet',
                location: data.format === 'physique' ? data.location : '',
                notes: data.notes,
                includeClient: data.includeClient,
                includeIntervenant: data.includeIntervenant,
                eventUrl: '',
                meetLink: data.format === 'meet' ? manualLink : ''
            };

            if (data.addCalendar) {
                setButtonLoading('btn-save-meeting-modal', true, 'Ajout calendrier...');
                try {
                    payload = await new Promise(function(resolve, reject) {
                        google.script.run
                            .withSuccessHandler(function(result) {
                                resolve(result && typeof result === 'object' ? result : payload);
                            })
                            .withFailureHandler(function(err) {
                                reject(err);
                            })
                            .planifierReunionEtudeCalendar(currentStudyId, {
                                startIso: data.startDate.toISOString(),
                                durationMinutes: data.durationMinutes,
                                withMeet: data.format === 'meet',
                                includeClient: data.includeClient,
                                includeIntervenant: data.includeIntervenant,
                                location: data.location,
                                notes: data.notes
                            });
                    });
                } catch (err) {
                    setButtonLoading('btn-save-meeting-modal', false);
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'planifierReunionEtudeCalendar',
                        userMessage: 'Impossible d\'ajouter la réunion au calendrier du chargé.'
                    });
                    return;
                }
                setButtonLoading('btn-save-meeting-modal', false);
            }

            if (manualLink && !payload.meetLink && data.format === 'meet') {
                payload.meetLink = manualLink;
            }

            const entry = buildMeetingEntryFromPayload_(payload, data.addCalendar ? 'calendar' : 'manual', status);
            if (editId) {
                entry.id = editId;
            }
            if (data.format === 'physique') {
                entry.meetingLink = manualLink || entry.meetingLink || '';
            }

            upsertMeetingHistoryEntry_(entry);
            closeMeetingHistoryModal();
        }

        function switchRealisationSubtab(subtab) {
            const target = (subtab === 'planning') ? 'planning' : 'suivis';
            currentRealisationSubtab = target;

            const planning = document.getElementById('realisation-subtab-planning');
            const suivis = document.getElementById('realisation-subtab-suivis');
            const btnPlanning = document.getElementById('btn-real-subtab-planning');
            const btnSuivis = document.getElementById('btn-real-subtab-suivis');

            if (planning) planning.classList.toggle('hidden', target !== 'planning');
            if (suivis) suivis.classList.toggle('hidden', target !== 'suivis');

            if (btnPlanning) {
                btnPlanning.className = 'px-3 py-2 text-sm font-semibold rounded-md border transition-colors ' +
                    (target === 'planning'
                        ? 'border-indigo-300 bg-indigo-50 text-indigo-700'
                        : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50');
            }
            if (btnSuivis) {
                btnSuivis.className = 'px-3 py-2 text-sm font-semibold rounded-md border transition-colors ' +
                    (target === 'suivis'
                        ? 'border-indigo-300 bg-indigo-50 text-indigo-700'
                        : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50');
            }

            if (target === 'suivis') {
                ensureDefaultSuiviMeetingDate_();
                onChangeFormatSuiviReunion();
                renderMeetingFollowups_();
            }
        }

        function openRealisationFollowupsFromAvantProjet() {
            switchEtudeTab('realisation');
            switchRealisationSubtab('suivis');
            const target = document.getElementById('realisation-subtab-suivis');
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function planifierReunionSuiviRealisation() {
            if (!currentStudyId) {
                jAlert('Aucune étude sélectionnée.', 'Erreur', 'danger');
                return;
            }

            let data;
            try {
                data = collectMeetingFormData_('suivi-meeting');
            } catch (e) {
                jAlert(e && e.message ? e.message : 'Données de réunion invalides.', 'Erreur', 'warning');
                return;
            }

            if (!data.includeClient && !data.includeIntervenant) {
                jAlert('Sélectionnez au moins un participant (client ou intervenant).', 'Participants manquants', 'warning');
                return;
            }

            if (data.format === 'physique' && !data.location) {
                jAlert('Renseignez le lieu de la réunion physique.', 'Lieu manquant', 'warning');
                return;
            }

            const ok = await jConfirm(
                'La réunion sera ajoutée à l\'historique de l\'étude' + (data.addCalendar ? ' et au calendrier du chargé.' : '.'),
                'Planifier la réunion de suivi ? ',
                { confirmText: 'Planifier', cancelText: 'Annuler', type: 'info' }
            );
            if (!ok) return;

            let payload = {
                success: true,
                startIso: data.startDate.toISOString(),
                durationMinutes: data.durationMinutes,
                withMeet: data.format === 'meet',
                location: data.format === 'physique' ? data.location : '',
                notes: data.notes,
                includeClient: data.includeClient,
                includeIntervenant: data.includeIntervenant,
                eventUrl: '',
                meetLink: ''
            };

            if (data.addCalendar) {
                setButtonLoading('btn-planifier-suivi-meeting', true, 'Planification...');
                try {
                    payload = await new Promise(function(resolve, reject) {
                        google.script.run
                            .withSuccessHandler(function(result) {
                                resolve(result && typeof result === 'object' ? result : payload);
                            })
                            .withFailureHandler(function(err) {
                                reject(err);
                            })
                            .planifierReunionEtudeCalendar(currentStudyId, {
                                startIso: data.startDate.toISOString(),
                                durationMinutes: data.durationMinutes,
                                withMeet: data.format === 'meet',
                                includeClient: data.includeClient,
                                includeIntervenant: data.includeIntervenant,
                                location: data.location,
                                notes: data.notes
                            });
                    });
                } catch (err) {
                    setButtonLoading('btn-planifier-suivi-meeting', false);
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'planifierReunionEtudeCalendar',
                        userMessage: 'Impossible de planifier la réunion de suivi.'
                    });
                    return;
                }
                setButtonLoading('btn-planifier-suivi-meeting', false);
            }

            const entry = buildMeetingEntryFromPayload_(payload, data.addCalendar ? 'calendar' : 'manual', 'planifiee');
            upsertMeetingHistoryEntry_(entry);

            if (payload.eventUrl) window.open(payload.eventUrl, '_blank', 'noopener,noreferrer');
            if (payload.meetLink) window.open(payload.meetLink, '_blank', 'noopener,noreferrer');

            jAlert('Réunion enregistrée dans l\'historique de l\'étude.', 'Planification réussie', 'success', { disableDsi: true });
        }

            if (!Array.isArray(currentClientInfo.contacts)) return;
            const wasSignatory = currentClientInfo.contacts[index] && currentClientInfo.contacts[index].isSignatory;
            currentClientInfo.contacts.splice(index, 1);
            if (currentClientInfo.type !== 'Particulier' && currentClientInfo.contacts.length === 0) {
                const nextContact = createEmptyClientContact();
                nextContact.isSignatory = true;
                currentClientInfo.contacts.push(nextContact);

                currentClientInfo.contacts[0].isSignatory = true;

            queueSaveClientInfo();

        function ouvrirBrouillonInscriptionIntervenantSg_(fullName, email) {
            const subject = 'Inscription intervenant - Étude ' + ((document.getElementById('etude-ref') || {}).textContent || '');
            const body =
                'Bonjour Secrétaire Général,\n\n' +
                'Merci d\'inscrire ' + (fullName || 'cet intervenant') +
                (email ? (', email ' + email) : '') + '.\n\n' +
                'Merci.';

            const gmailUrl =
                'https://mail.google.com/mail/?view=cm&fs=1&tf=1' +
                '&to=' + encodeURIComponent('secretairegeneral@juniorinsaservices.fr') +
                '&su=' + encodeURIComponent(subject) +
                '&body=' + encodeURIComponent(body);
            window.open(gmailUrl, '_blank', 'noopener,noreferrer');
        }

        function demanderInscriptionIntervenantSg() {
            if (!currentIntervenantInfo) loadIntervenantInfoFromEtude_();
            const i = currentIntervenantInfo || getDefaultIntervenantInfo();
            const fullName = [i.prenom || '', i.nom || ''].filter(Boolean).join(' ').trim();
            const email = (i.email || '').trim();

            if (!fullName && !email) {
                jAlert('Renseignez au moins le nom ou lemail de lintervenant avant denvoyer la demande SG.', 'Informations manquantes', 'warning');
                return;
            }

            setButtonLoading('btn-demande-sg-inscription', true, 'Envoi au SG...');
            google.script.run
                .withSuccessHandler(function(result) {
                    setButtonLoading('btn-demande-sg-inscription', false);
                    const ok = !!(result && result.success);
                    if (!ok) {
                        ouvrirBrouillonInscriptionIntervenantSg_(fullName, email);
                        const errMsg = result && result.error ? result.error : 'Message SG non transmis automatiquement.';
                        jAlert('Envoi direct au chat SG indisponible.<br>' + escapeHtml(errMsg) + '<br>Un brouillon mail a été ouvert en secours.', 'Mode secours', 'warning');
                        return;
                    }

                    if (!negociationStepStates.interv) negociationStepStates.interv = {};
                    negociationStepStates.interv[2] = true;
                    persistNegociationSteps_();
                    renderNegociationStepChecklists_();
                    syncStatusFromProgression_();

                    const chatUrl = String(result.chatUrl || SG_INTERVENANT_CHAT_URL);
                    window.open(chatUrl, '_blank', 'noopener,noreferrer');
                    jAlert('Les informations intervenant ont été envoyées au SG sur Google Chat.', 'Envoi réussi', 'success');
                })
                .withFailureHandler(function(err) {
                    setButtonLoading('btn-demande-sg-inscription', false);
                    ouvrirBrouillonInscriptionIntervenantSg_(fullName, email);
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'envoyerInfosIntervenantSgChat',
                        userMessage: 'Impossible denvoyer directement les infos intervenant au SG. Un brouillon mail a été ouvert en secours.'
                    });
                })
                .envoyerInfosIntervenantSgChat(currentStudyId, {
                    civilite: i.civilite || '',
                    prenom: i.prenom || '',
                    nom: i.nom || '',
                    email: i.email || '',
                    portable: i.portable || '',
                    etudeNom: (document.getElementById('etude-name') || {}).textContent || '',
                    reference: (document.getElementById('etude-ref') || {}).textContent || ''
                });
        }

        function getNegociationStepState_() {
            if (!negociationStepStates) {
                negociationStepStates = { client: {}, interv: {} };
            }
            return negociationStepStates;
        }

        function saveNegociationSteps_() {
            if (!currentStudyId) return;
            google.script.run
                .withFailureHandler(function(error) {
                    handleUiError_(error, {
                        source: 'google.script.run',
                        location: 'enregistrerDonneeEtude(Negociation_Steps)',
                        userMessage: 'La sauvegarde des checklists de négociation a échoué.',
                        silent: true
                    });
                })
                .enregistrerDonneeEtude(currentStudyId, 'Negociation_Steps', JSON.stringify(negociationStepStates));
            scheduleStudySaveFlush();
        }

        function persistNegociationSteps_() {
            saveNegociationSteps_();
        }

        function toggleNegociationStep(group, step) {
            const g = group === 'interv' ? 'interv' : 'client';
            let s = step;
            if (typeof s === 'string' && /^[0-9]+$/.test(s)) {
                s = parseInt(s, 10);
            }
            if (!s) return;

            getNegociationStepState_();
            if (!negociationStepStates[g]) negociationStepStates[g] = {};
            negociationStepStates[g][s] = !negociationStepStates[g][s];
            persistNegociationSteps_();
            renderNegociationStepChecklists_();
            syncStatusFromProgression_();
        }

        function isNegociationChecklistDone_(group) {
            const g = group === 'interv' ? 'interv' : 'client';
            const state = getNegociationStepState_();
            if (g === 'interv') {
                for (let i = 1; i <= 4; i++) {
                    if (!(state[g] && state[g][i])) return false;
                }
                return true;
            } else {
                const mode = getNegociationClientMode_();
                if (mode === 'ce') return !!(state[g] && state[g]['ce']);
                if (mode === 'cc_bdc') return !!(state[g] && state[g]['cc']) && !!(state[g] && state[g]['bdc']);
                return false;
            }
        }

        function renderNegociationStepChecklists_() {
            const state = getNegociationStepState_();
            ['client', 'interv'].forEach(function(group) {
                let done = 0;
                let total = 0;
                const inputs = document.querySelectorAll(`input[data-neg-step^="${group}-"]`);
                
                inputs.forEach(input => {
                    total++;
                    const stepKey = input.getAttribute('data-neg-step').split('-')[1];
                    let s = stepKey;
                    if (/^[0-9]+$/.test(s)) s = parseInt(s, 10);
                    
                    const checked = !!(state[group] && state[group][s]);
                    input.checked = checked;
                    if (checked) done++;
                    
                    const container = input.closest('.ap-step-card') || input.closest('[data-neg-interv-step]') || input.closest('[data-neg-client-step]');
                    if (container) {
                        container.classList.toggle('done', checked);
                        
                        const dot = container.querySelector('.ap-step-done-dot');
                        if (dot) {
                            const numSpan = dot.querySelector('.ap-dot-num');
                            const checkIcon = dot.querySelector('.ap-dot-check');
                            if (checked) {
                                dot.className = 'absolute -left-[1.35rem] top-2 w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold z-10 ap-step-done-dot shadow-sm';
                                if (numSpan) numSpan.classList.add('hidden');
                                if (checkIcon) checkIcon.classList.remove('hidden');
                            } else {
                                dot.className = 'absolute -left-[1.35rem] top-2 w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center text-sm font-bold z-10 ap-step-done-dot';
                                if (numSpan) numSpan.classList.remove('hidden');
                                if (checkIcon) checkIcon.classList.add('hidden');
                            }
                        }
                        
                        if (!container.classList.contains('ap-step-card')) {
                            container.classList.add('ap-step-card');
                            if(!container.querySelector('.ap-card-inner') && container.children.length > 0) {
                                const inner = document.createElement('div');
                                inner.className = 'ap-card-inner flex flex-col gap-3 p-4 bg-white rounded-lg border border-transparent transition-all';
                                while (container.firstChild) {
                                    inner.appendChild(container.firstChild);
                                }
                                container.appendChild(inner);
                                container.classList.remove('p-4', 'bg-gray-50');
                                container.classList.add('bg-transparent', 'border-none');
                            }
                        }
                    }
                });

                const badge = document.getElementById('neg-' + group + '-progress');
                if (badge && total > 0) {
                    badge.textContent = done + '/' + total;
                    if (done === total) {
                        badge.className = 'text-xs font-semibold bg-green-100 text-green-700 px-2 py-0.5 rounded-full';
                    } else if (done > 0) {
                        badge.className = 'text-xs font-semibold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full';
                    } else {
                        badge.className = 'text-xs font-semibold bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full';
                    }
                } else if (badge && total === 0) {
                     badge.textContent = '0/0';
                }
            });
        }

        function getNegociationClientMode_() {
            const mode = String(currentEtudeData.negociationClientMode || '').toLowerCase();
            if (mode === 'ce') return 'ce';
            if (mode === 'cc_bdc') return 'cc_bdc';
            return '';
        }

        function resetNegociationDocStates_() {
            negociationDocStates = buildEmptyWorkflowDocStates_();
            selectedNegociationStages = buildEmptySelectedWorkflowStages_();
            studySectionsLoaded.realisationDocs = false;
            realisationDocKeysCache = [];
        }

        function initNegociationSection(studyId) {
            if (!studyId) {
                renderNegociationSection();
                return;
            }

            if (studySectionsLoaded.negociation) {
                renderNegociationSection();
                return;
            }

            renderNegociationSection();
            google.script.run
                .withSuccessHandler(function(payload) {
                    const p = payload && typeof payload === 'object' ? payload : {};
                    ['ce', 'cc', 'bdc', 'rm'].forEach(function(key) {
                        negociationDocStates[key] = Object.assign(createEmptyWorkflowDocState_(), {
                            loaded: true
                        }, p[key] || {});
                    });
                    studySectionsLoaded.negociation = true;
                    renderNegociationSection();
                    syncStatusFromProgression_();
                })
                .withFailureHandler(function(err) {
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'obtenirStatutsNegociationEtude',
                        userMessage: 'Impossible de récupérer les statuts des documents de négociation.'
                    });
                    ['ce', 'cc', 'bdc', 'rm'].forEach(function(key) {
                        negociationDocStates[key].loaded = true;
                    });
                    studySectionsLoaded.negociation = true;
                    renderNegociationSection();
                    syncStatusFromProgression_();
                })
                .obtenirStatutsNegociationEtude(studyId);
        }

        function definirModeNegociationClient(mode) {
            const normalized = mode === 'ce' ? 'ce' : (mode === 'cc_bdc' ? 'cc_bdc' : '');
            currentEtudeData.negociationClientMode = normalized;
            getNegociationStepState_();
            if (normalized) {
                if (!negociationStepStates.client) negociationStepStates.client = {};
                negociationStepStates.client[1] = true;
                persistNegociationSteps_();
            } else {
                saveEtudeInfo();
            }
            renderNegociationSection();
            studySectionsLoaded.realisationDocs = false;
            initRealisationDocsSection(currentStudyId);
            syncStatusFromProgression_();
        }

        function getCurrentWorkflowStage_(state, relectureStatus) {
            const s = state || {};
            const exists = !!(s.hasDraft || s.hasValide || s.hasPdf);
            if (!exists) return 'generate';
            if (s.hasValide) return 'move';
            if (s.relectureDemandee) {
                if (relectureStatus === 'changes') return 'edit';
                if (relectureStatus === 'approved') return 'validate';
                return 'review';
            }
            return 'review';
        }

        function getNegociationRelectureStatus_(docKey) {
            const all = currentEtudeData.negociationRelectureStatus && typeof currentEtudeData.negociationRelectureStatus === 'object'
                ? currentEtudeData.negociationRelectureStatus
                : {};
            const s = String(all[docKey] || 'none');
            return s;
        }

        function setNegociationRelectureStatus(docKey, status) {
            const allowed = { pending:true, approved:true, changes:true, none:true };
            const next = allowed[status] ? status : 'pending';
            if (!currentEtudeData.negociationRelectureStatus || typeof currentEtudeData.negociationRelectureStatus !== 'object') {
                currentEtudeData.negociationRelectureStatus = {};
            }
            currentEtudeData.negociationRelectureStatus[docKey] = next;
            saveEtudeInfo();
            renderNegociationSection();
            renderRealisationDocsSection();
            syncStatusFromProgression_();
        }

        function selectNegociationStage(docKey, stage) {
            const allowed = { generate:true, edit:true, review:true, validate:true, visio:true, move:true };
            selectedNegociationStages[docKey] = allowed[stage] ? stage : '';
            renderNegociationSection();
            renderRealisationDocsSection();
        }

        function getNegociationDocLabel_(docKey) {
            if (docKey === 'ce') return 'Convention étude';
            if (docKey === 'cc') return 'Convention cadre';
            if (docKey === 'bdc') return 'Bon de commande';
            if (docKey === 'rm') return 'RM';
            if (docKey === 'arm') return 'ARM';
            if (docKey === 'arrm') return 'ARRM';
            if (docKey === 'arce') return 'ARCE';
            if (docKey === 'ace') return 'ACE';
            if (docKey === 'acc') return 'Avenant CC';
            if (docKey === 'bdcr') return 'BDCR';
            return 'Document';
        }

        
function wrapNegociationClientCard_(docKey) {
    const cardHtml = buildNegociationDocCardHtml_(docKey);
    const label = getNegociationDocLabel_(docKey);
    
    let isCcBdc = (docKey === 'cc' || docKey === 'bdc');
    let stepNumber = '';
    if (docKey === 'cc') stepNumber = '1';
    else if (docKey === 'bdc') stepNumber = '2';

    if (isCcBdc) {
        return `

                    <span class="ap-dot-num">${stepNumber}</span>
                    <i class="fas fa-check ap-dot-check hidden"></i>

                        <label class="ap-checkbox flex items-center cursor-pointer select-none" onclick="event.stopPropagation()">
                            <input type="checkbox" class="sr-only" data-neg-step="client-${docKey}" onchange="basculerEtapeNegociation('client', '${docKey}')">
                            <span class="ap-toggle w-10 h-6 bg-gray-200 rounded-full relative inline-block transition-colors">

        `;
    } else {
        return `
            <div class="ap-step-card p-4 rounded-lg border border-gray-200 bg-gray-50 transition-colors" data-neg-client-step="${docKey}">
                <div class="ap-card-inner flex flex-col gap-3 mb-3">
                    <div class="flex items-center justify-between gap-3">
                        <p class="font-medium text-base text-gray-800">${label}</p>
                        <label class="ap-checkbox flex items-center cursor-pointer select-none" onclick="event.stopPropagation()">
                            <input type="checkbox" class="sr-only" data-neg-step="client-${docKey}" onchange="basculerEtapeNegociation('client', '${docKey}')">
                            <span class="ap-toggle w-10 h-6 bg-gray-200 rounded-full relative inline-block transition-colors">
                                <span class="ap-toggle-dot absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"></span>

                            <span class="ml-2 text-sm text-gray-400 ap-toggle-label">Fait</span>

        `;
