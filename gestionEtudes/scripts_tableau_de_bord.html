}

        function buildNegociationDocCardHtml_(docKey) {
            const state = negociationDocStates[docKey] || {};
            const label = getNegociationDocLabel_(docKey);
            const exists = !!(state.hasDraft || state.hasValide || state.hasPdf);
            const relectureStatus = getNegociationRelectureStatus_(docKey);
            const currentStage = getCurrentWorkflowStage_(state, relectureStatus);
            const selectedStage = selectedNegociationStages[docKey] || currentStage;
            const stageKey = String(docKey || 'doc');

            if (!state.loaded) {
                return `<div class="p-4 border border-gray-200 rounded-md bg-gray-50"><p class="text-sm text-gray-500"><i class="fas fa-circle-notch fa-spin mr-2"></i>Chargement de ${label.toLowerCase()}...</p></div>`;
            }

            const neutralBtn = 'text-sm bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-3 py-1.5 rounded-md font-medium inline-flex items-center gap-1.5 transition-colors';
            const primaryBtn = 'text-sm bg-indigo-600 border border-indigo-600 text-white hover:bg-indigo-700 px-3 py-1.5 rounded-md font-medium inline-flex items-center gap-1.5 transition-colors';
            const doneBtn = 'btn-devis-done';

            const stages = [
                { key:'generate', label:'1. Générer' },
                { key:'edit', label:'2. Modifier' },
                { key:'review', label:'3. Relecture' },
                { key:'validate', label:'4. Validation' },
                { key:'move', label:'5. Signé / Archivé' }
            ];

            let headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-gray-100 text-gray-600">Non démarré</span>';
            if (state.hasValide) headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-green-100 text-green-700">Signé</span>';
            else if (state.relectureDemandee && relectureStatus === 'approved') headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-green-100 text-green-700">Validé</span>';
            else if (state.relectureDemandee && relectureStatus === 'changes') headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-amber-100 text-amber-700">Corrections</span>';
            else if (state.relectureDemandee) headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-indigo-50 text-indigo-700">En relecture</span>';
            else if (exists) headerBadge = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-blue-50 text-blue-700">À relire</span>';

            let html = '';
            html += `<div class="p-4 border border-gray-200 rounded-xl bg-white mb-3 shadow-sm hover:shadow-md transition-shadow">`;
            html += `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><h4 class="font-semibold text-base text-gray-800">${label}</h4>${headerBadge}</div>`;
            
            // Nouveau menu de navigation horizontal
            html += `<nav class="flex flex-wrap p-1 bg-gray-100 rounded-lg border border-gray-200 mb-4 gap-1">`;
            html += stages.map(function(st) {
                const isActive = st.key === selectedStage;
                const isCurrent = st.key === currentStage;
                let cClass = isActive ? 'bg-white text-indigo-600 font-semibold shadow-sm border border-gray-200' 
                            : (isCurrent ? 'bg-indigo-50 text-indigo-600 font-medium' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-200/50 border border-transparent');
                return `<button onclick="selectionnerEtapeNegociation('${stageKey}','${st.key}')" class="whitespace-nowrap px-3 py-1.5 text-xs rounded-md transition-all ${cClass}">${st.label}</button>`;
            }).join('');
            html += `</nav>`;

            // Conteneur d'actions
            html += `<div class="flex flex-wrap gap-2">`;

            if (selectedStage === 'generate') {
                if (exists) {
                    if (stageKey === 'bdc') {
                        html += `<button id="btn-generate-neg-${stageKey}" onclick="genererDocNegociation('${stageKey}', true)" class="${primaryBtn}"><i class="fas fa-plus"></i> Créer un nouveau BDC</button>`;
                        html += `<button id="btn-regenerate-neg-${stageKey}" onclick="genererDocNegociation('${stageKey}', false)" class="${neutralBtn}"><i class="fas fa-rotate"></i> Re-générer l'actuel</button>`;
                    } else {
                        html += `<button id="btn-generate-neg-${stageKey}" onclick="genererDocNegociation('${stageKey}')" class="${primaryBtn}"><i class="fas fa-rotate"></i> Re-générer</button>`;
                    }
                } else {
                    html += `<button id="btn-generate-neg-${stageKey}" onclick="genererDocNegociation('${stageKey}', true)" class="${primaryBtn}"><i class="fas fa-wand-magic-sparkles"></i> Générer</button>`;
                }
            }

            if (exists && selectedStage === 'edit') {
                html += `<button onclick="ouvrirDocNegociation('${stageKey}')" class="${primaryBtn}"><i class="fas fa-pen"></i> Modifier le document</button>`;
            }

            if (exists && selectedStage === 'review') {
                if (state.relectureDemandee) {
                    html += `<button class="${doneBtn} cursor-default"><i class="fas fa-check-circle"></i> Relecture demandée</button>`;
                    html += `<button onclick="ouvrirChatDocNegociation('${stageKey}')" class="${neutralBtn}"><i class="fas fa-comments"></i> Voir le chat de relecture</button>`;
                } else {
                    html += `<button id="btn-review-neg-${stageKey}" onclick="demanderRelectureDocNegociation('${stageKey}')" class="${primaryBtn}"><i class="fas fa-paper-plane"></i> Demander une relecture</button>`;
                }
            }

            if (exists && selectedStage === 'validate') {
                if (state.relectureDemandee) {
                    html += `<div class="w-full mt-2 p-2 border border-gray-200 rounded-md bg-gray-50">`;
                    html += `<p class="text-xs text-gray-500 mb-2">Retour pôle qualité</p>`;
                    html += `<div class="flex flex-wrap gap-2">`;
                    html += `<button onclick="setNegociationRelectureStatus('${stageKey}', 'approved')" class="${relectureStatus === 'approved' ? primaryBtn : neutralBtn}"><i class="fas fa-square-check"></i> Validé</button>`;
                    html += `<button onclick="setNegociationRelectureStatus('${stageKey}', 'changes')" class="${relectureStatus === 'changes' ? primaryBtn : neutralBtn}"><i class="fas fa-triangle-exclamation"></i> Erreurs</button>`;
                    html += `<button onclick="setNegociationRelectureStatus('${stageKey}', 'pending')" class="${(relectureStatus === 'pending' || relectureStatus === 'none') ? primaryBtn : neutralBtn}"><i class="fas fa-hourglass-half"></i> En attente</button>`;
                    html += `</div></div>`;
                } else {
                    html += `<p class="text-sm text-gray-500">Envoyez le document en relecture pour saisir le retour qualité.</p>`;

        function initRealisationDocsSection(studyId) {
            const keys = getRealisationDocKeys_();
            realisationDocKeysCache = keys.slice();

            if (!keys.length) {
                studySectionsLoaded.realisationDocs = true;
                renderRealisationDocsSection();
                return;
            }

            if (!studyId) {
                renderRealisationDocsSection();
                return;
            }

            const needsLoad = !studySectionsLoaded.realisationDocs || keys.some(function(key) {
                return !(negociationDocStates[key] && negociationDocStates[key].loaded);
            });

            renderRealisationDocsSection();
            if (!needsLoad) {
                syncStatusFromProgression_();
                return;
            }

            google.script.run
                .withSuccessHandler(function(payload) {
                    const p = payload && typeof payload === 'object' ? payload : {};
                    keys.forEach(function(key) {
                        negociationDocStates[key] = Object.assign(createEmptyWorkflowDocState_(), {
                            loaded: true
                        }, p[key] || {});
                    });
                    studySectionsLoaded.realisationDocs = true;
                    renderRealisationDocsSection();
                    syncStatusFromProgression_();
                })
                .withFailureHandler(function(err) {
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'obtenirStatutsDocumentsWorkflowEtude',
                        userMessage: 'Impossible de récupérer les statuts des documents de réalisation.'
                    });
                    keys.forEach(function(key) {
                        if (!negociationDocStates[key]) negociationDocStates[key] = createEmptyWorkflowDocState_();
                        negociationDocStates[key].loaded = true;
                    });
                    studySectionsLoaded.realisationDocs = true;
                    renderRealisationDocsSection();
                    syncStatusFromProgression_();
                })
                .obtenirStatutsDocumentsWorkflowEtude(studyId, keys);
        }

            function refreshWorkflowSectionsAfterAction_() {
                if (!currentStudyId) return;
                studySectionsLoaded.negociation = false;
                studySectionsLoaded.realisationDocs = false;
                initNegociationSection(currentStudyId);
                initRealisationDocsSection(currentStudyId);
                renderNegociationStepChecklists_();
                syncStatusFromProgression_();
            }

        async function genererDocNegociation(docKey, isNewBdc) {
            if (!currentStudyId) { jAlert('Aucune étude sélectionnée.', 'Erreur', 'danger'); return; }
            const state = negociationDocStates[docKey] || {};
            const exists = !!(state.hasDraft || state.hasPdf || state.hasValide);

            if (exists && !(docKey === 'bdc' && isNewBdc)) {
                const ok = await jConfirm(
                    'Un document existe déjà dans <strong>2. [REF] Documents éditables</strong>.<br>Le re-générer écrasera la version courante et réinitialisera la relecture pour ce document.',
                    'Re-générer le document ?',
                    { danger:true, confirmText:'Re-générer', cancelText:'Annuler' }
                );
                if (!ok) return;
            } else if (docKey === 'bdc' && isNewBdc && exists) {
                const ok = await jConfirm(
                    'Vous allez créer un **nouveau Bon de Commande**. Ce dernier remplacera votre document actif dans la case ci-dessous, mais l\'ancien BDC sera conservé (historique).',
                    'Créer un nouveau BDC ?',
                    { confirmText:'Créer le nouveau', cancelText:'Annuler' }
                );
                if (!ok) return;
            }

            const buttonId = (docKey === 'bdc' && !isNewBdc && exists) ? 'btn-regenerate-neg-' + docKey : 'btn-generate-neg-' + docKey;
            setButtonLoading(buttonId, true, exists ? 'Re-génération...' : 'Génération...');
            google.script.run
                .withSuccessHandler(function(result) {
                    setButtonLoading(buttonId, false);
                    if (result && result.url) window.open(result.url, '_blank', 'noopener,noreferrer');
                    if (!currentEtudeData.negociationRelectureStatus || typeof currentEtudeData.negociationRelectureStatus !== 'object') {
                        currentEtudeData.negociationRelectureStatus = {};
                    }
                    currentEtudeData.negociationRelectureStatus[docKey] = 'none';

                    const mode = getNegociationClientMode_();
                    getNegociationStepState_();
                    if (!negociationStepStates.client) negociationStepStates.client = {};
                    if (!negociationStepStates.interv) negociationStepStates.interv = {};
                    if (docKey === 'ce' || docKey === 'cc' || docKey === 'bdc') {
                        negociationStepStates.client[2] = true;
                        if ((mode === 'ce' && docKey === 'ce') || (mode === 'cc_bdc' && (docKey === 'cc' || docKey === 'bdc'))) {
                            negociationStepStates.client[1] = true;
                        }
                    }
                    if (docKey === 'rm') {
                        negociationStepStates.interv[4] = true;
                    }
                    persistNegociationSteps_();
                    refreshWorkflowSectionsAfterAction_();
                })
                .withFailureHandler(function(err) {
                    setButtonLoading(buttonId, false);
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'genererDocumentNegociationEtude(' + String(docKey || '') + ')',
                        userMessage: 'Erreur lors de la génération du document.'
                    });
                })
                .genererDocumentNegociationEtude(currentStudyId, docKey, docKey === 'bdc' && isNewBdc ? false : exists, !!isNewBdc);
        }

                jAlert('Lien non disponible pour ce document.', 'Lien introuvable', 'warning');

        async function demanderRelectureDocNegociation(docKey) {
            if (!currentStudyId) { jAlert('Aucune étude sélectionnée.', 'Erreur', 'danger'); return; }
            const state = negociationDocStates[docKey] || {};
            if (!state.hasDraft) {
                jAlert('Aucun document trouvé dans <strong>2. [REF] Documents éditables</strong>.', 'Document manquant', 'warning');
                return;
            }

            const ok = await jConfirm(
                'Le document sera exporté en PDF (_relecture.pdf) et envoyé dans lespace Google Chat de relecture.',

            );

            const buttonId = 'btn-review-neg-' + docKey;
            setButtonLoading(buttonId, true, 'Envoi...');
            google.script.run
                .withSuccessHandler(function() {
                    setButtonLoading(buttonId, false);
                    if (!currentEtudeData.negociationRelectureStatus || typeof currentEtudeData.negociationRelectureStatus !== 'object') {
                        currentEtudeData.negociationRelectureStatus = {};
                    }
                    currentEtudeData.negociationRelectureStatus[docKey] = 'pending';

                    if (docKey === 'ce' || docKey === 'cc' || docKey === 'bdc' || docKey === 'rm') {
                        getNegociationStepState_();
                        if (!negociationStepStates.client) negociationStepStates.client = {};
                        if (!negociationStepStates.interv) negociationStepStates.interv = {};
                        if (docKey === 'rm') {
                            negociationStepStates.interv[4] = true;
                        } else {
                            negociationStepStates.client[3] = true;
                        }
                        persistNegociationSteps_();
                    } else {
                        saveEtudeInfo();
                    }
                    refreshWorkflowSectionsAfterAction_();
                })
                .withFailureHandler(function(err) {
                    setButtonLoading(buttonId, false);
                    jAlert('Erreur lors de lenvoi relecture : ' + (err && err.message ? err.message : err), 'Erreur', 'danger');
                })
                .envoyerDocumentNegociationRelectureChat(currentStudyId, docKey, { showChecklist: true });

        function basculerSignatureDocumentWorkflow(docKey, isSigned) {
            if (!currentStudyId) {
                jAlert('Aucune étude sélectionnée.', 'Erreur', 'danger');
                return;
            }

            const key = String(docKey || '').trim().toLowerCase();
            if (!key) return;
            const signed = !!isSigned;

            google.script.run
                .withSuccessHandler(function(result) {
                    if (!negociationDocStates[key]) negociationDocStates[key] = createEmptyWorkflowDocState_();
                    negociationDocStates[key].hasValide = signed;
                    negociationDocStates[key].archiveRequired = signed;
                    negociationDocStates[key].signedAt = result && result.signedAt ? result.signedAt : (signed ? new Date().toISOString() : '');
                    if (result && result.valideUrl) negociationDocStates[key].valideUrl = result.valideUrl;

                    if (key === 'ce' || key === 'cc' || key === 'bdc' || key === 'rm') {
                        getNegociationStepState_();
                        if (!negociationStepStates.client) negociationStepStates.client = {};
                        if (!negociationStepStates.interv) negociationStepStates.interv = {};
                        if (key === 'ce' || key === 'cc' || key === 'bdc') {
                            negociationStepStates.client[4] = signed;
                        }
                        if (key === 'rm') {
                            negociationStepStates.interv[4] = signed;
                        }
                        persistNegociationSteps_();
                    }

                    renderNegociationSection();
                    renderRealisationDocsSection();
                    syncStatusFromProgression_();
                })
                .withFailureHandler(function(err) {
                    jAlert('Impossible de mettre à jour l\'état signé : ' + (err && err.message ? err.message : err), 'Erreur', 'danger');
                    renderNegociationSection();
                    renderRealisationDocsSection();
                })
                .marquerDocumentWorkflowSigne(currentStudyId, key, signed);
        }

        async function validerDocNegociation(docKey) {
            basculerSignatureDocumentWorkflow(docKey, true);
        }

                if (!email) return null;
                return {
                    email,
                    civility: (p.civility || '').trim(),
                    firstName: (p.firstName || '').trim(),
                    lastName: (p.lastName || '').trim()
                };

            const contacts = Array.isArray(currentClientInfo.contacts) ? currentClientInfo.contacts : [];
            const first = contacts[0] || null;
            if (!first || !(first.email || '').trim()) return null;

            return {
                email: (first.email || '').trim(),
                civility: (first.civility || '').trim(),
                firstName: (first.firstName || '').trim(),
                lastName: (first.lastName || '').trim()
            };

        function formatRelativeTimeFromIso(isoDate) {
            if (!isoDate) return '';
            const date = new Date(isoDate);
            if (Number.isNaN(date.getTime())) return '';

            const diffMs = Math.max(0, Date.now() - date.getTime());
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'à l\'instant';
            if (diffMin < 60) return 'il y a ' + diffMin + ' min';

            const diffHours = Math.floor(diffMin / 60);
            if (diffHours < 24) return 'il y a ' + diffHours + ' h';

            const diffDays = Math.floor(diffHours / 24);
            return 'il y a ' + diffDays + ' j';
        }

        let _jModalCb = null;
        function jModal({ title, message, type, confirmText, cancelText, danger, onConfirm, onCancel }) {
            _jModalCb = { onConfirm: onConfirm||null, onCancel: onCancel||null };
            const types = {
                info:    { icon:'fa-info-circle',         bg:'bg-blue-100 text-blue-600'   },
                danger:  { icon:'fa-exclamation-triangle',bg:'bg-red-100 text-red-600'     },
                success: { icon:'fa-check-circle',        bg:'bg-green-100 text-green-600' },
                warning: { icon:'fa-exclamation-circle',  bg:'bg-amber-100 text-amber-600' }
            };
            const t = types[type||'info'] || types.info;
            document.getElementById('jmodal-icon').className =
                `w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${t.bg}`;
            document.getElementById('jmodal-icon').innerHTML = `<i class="fas ${t.icon}"></i>`;
            document.getElementById('jmodal-title').textContent   = title   || '';
            document.getElementById('jmodal-message').innerHTML   = message || '';
            const confirmBtn = document.getElementById('jmodal-confirm');
            confirmBtn.textContent = confirmText || 'OK';
            confirmBtn.className = `px-5 py-2 text-sm font-semibold text-white rounded-xl transition-colors ${
                danger ? 'bg-red-500 hover:bg-red-600' : 'bg-indigo-600 hover:bg-indigo-700'}`;
            const cancelBtn = document.getElementById('jmodal-cancel');
            if (cancelText) { cancelBtn.textContent = cancelText; cancelBtn.classList.remove('hidden'); }
            else { cancelBtn.classList.add('hidden'); }
            const o = document.getElementById('jmodal-overlay');
            o.classList.remove('hidden'); o.classList.add('flex');
        }
        function jModalConfirm() {
            const o = document.getElementById('jmodal-overlay');
            o.classList.remove('flex'); o.classList.add('hidden');
            const cb = _jModalCb; _jModalCb = null;
            if (cb && cb.onConfirm) cb.onConfirm();
        }
        function jModalCancel() {
            const o = document.getElementById('jmodal-overlay');
            o.classList.remove('flex'); o.classList.add('hidden');
            const cb = _jModalCb; _jModalCb = null;
            if (cb && cb.onCancel) cb.onCancel();
        }
        function jAlert(message, title, type, opts) {
            const options = opts && typeof opts === 'object' ? opts : {};
            const alertType = type || 'info';
            const alertTitle = title || 'Information';

            if (alertType === 'danger' && options.disableDsi !== true) {
                const payload = options.ticketPayload || buildDsiTicketPayload_(options.error || stripHtmlTags(message), {
                    source: options.source || 'ui',
                    location: options.location || 'jAlert',
                    userMessage: options.userMessage || stripHtmlTags(message)
                });

                return new Promise(function(resolve) {
                    jModal({
                        title: alertTitle,
                        message: message,
                        type: 'danger',
                        danger: true,
                        confirmText: options.confirmText || 'Contacter le DSI',
                        cancelText: options.cancelText || 'Fermer',
                        onConfirm: function() {
                            envoyerTicketDsi_(payload).then(function(result) {
                                const sent = !!(result && result.success);

                                if (sent) {
                                    const ticketId = escapeHtml(result.ticketId || '');
                                    jModal({
                                        title: 'Ticket envoyé',
                                        message: 'Le ticket <strong>' + ticketId + '</strong> a été transmis au DSI.<br>' +
                                            '<a href="' + escapeHtmlAttr(result.ticketsUrl || DSI_TICKETS_URL) + '" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:underline">Ouvrir le chat tickets</a>',
                                        type: 'success',
                                        confirmText: 'OK',
                                        onConfirm: resolve
                                    });
                                    return;
                                }

                                const reason = escapeHtml((result && result.error) ? result.error : 'Impossible d\'envoyer le ticket automatiquement.');
                                jModal({
                                    title: 'Envoi impossible',
                                    message: 'Le ticket na pas pu etre envoye automatiquement.<br>' +
                                        '<span class="text-xs text-gray-500">' + reason + '</span><br>' +
                                        '<a href="' + escapeHtmlAttr((result && result.chatUrl) || DSI_CHAT_URL) + '" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:underline">Contacter le DSI dans Google Chat</a>',
                                    type: 'warning',
                                    confirmText: 'OK',
                                    onConfirm: resolve
                                });
                            });
                        },
                        onCancel: resolve
                    });
                });
            }

            return new Promise(r => jModal({ title: alertTitle, message, type: alertType, confirmText: 'OK', onConfirm: r }));
        }
        function jConfirm(message, title, opts) {
            return new Promise(r => jModal({
                title: title||'Confirmation', message,
                type: opts&&opts.type||'warning', danger: opts&&opts.danger,
                confirmText: opts&&opts.confirmText||'Confirmer',
                cancelText:  opts&&opts.cancelText||'Annuler',
                onConfirm: ()=>r(true), onCancel: ()=>r(false)
            }));
        }

        function renderApSteps() {
            ['client', 'interv'].forEach(group => {
                const totalSteps = group === 'client' ? 4 : 4;
                let doneCount = 0;

                for (let i = 1; i <= totalSteps; i++) {
                    const isDone = avantProjetSteps[group] && avantProjetSteps[group][i];
                    if (isDone) doneCount++;

                    const card = document.querySelector(`[data-step="${group}-${i}"]`);
                    if (!card) continue;

                    const dot = card.querySelector('.ap-step-done-dot');
                    const numSpan = dot.querySelector('.ap-dot-num');
                    const checkIcon = dot.querySelector('.ap-dot-check');
                    const checkbox = card.querySelector('.ap-checkbox input[type="checkbox"]');

                    if (isDone) {
                        card.classList.add('done');
                        dot.className = 'absolute -left-[1.35rem] top-2 w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center text-sm font-bold z-10 ap-step-done-dot shadow-sm';
                        numSpan.classList.add('hidden');
                        checkIcon.classList.remove('hidden');
                        if (checkbox) checkbox.checked = true;
                    } else {
                        card.classList.remove('done');
                        dot.className = 'absolute -left-[1.35rem] top-2 w-8 h-8 rounded-full bg-gray-300 text-white flex items-center justify-center text-sm font-bold z-10 ap-step-done-dot';
                        numSpan.classList.remove('hidden');
                        checkIcon.classList.add('hidden');
                        if (checkbox) checkbox.checked = false;
                    }
                }

                // Update progress badge
                const badge = document.getElementById(`ap-${group}-progress`);
                if (badge) {
                    badge.textContent = doneCount + '/' + totalSteps;
                    if (doneCount === totalSteps) {
                        badge.className = 'text-sm font-semibold bg-green-100 text-green-700 px-3 py-1 rounded-full';
                    } else if (doneCount > 0) {
                        badge.className = 'text-sm font-semibold bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full';
                    } else {
                        badge.className = 'text-sm font-semibold bg-gray-100 text-gray-500 px-3 py-1 rounded-full';
                    }
                }

            });

            // Also render planning when interv step 5 is visible
            renderPlanning();
            syncStatusFromProgression_();
        }

        function toNumber(value, fallback) {
            const n = parseFloat(value);
            return Number.isFinite(n) ? n : fallback;
        }

        function getCapitalSocialValue() {
            if (!currentClientInfo) return 0;
            if (currentClientInfo.type === 'Particulier') return 0;
            return Math.max(0, toNumber(currentClientInfo.capitalSocial, 0));
        }

        function getPlanningTotals() {
            let totalJeh = 0;
            let totalPrice = 0;

            currentPhases.forEach(p => {
                const jeh = Math.max(0, toNumber(p.jeh, 0));
                const priceJeh = Math.max(0, toNumber(p.priceJeh, 0));
                totalJeh += jeh;
                totalPrice += jeh * priceJeh;
            });

            return {
                totalJeh,
                totalPrice,
                frais: Math.min((10 * totalJeh) + (getCapitalSocialValue() * 0.0002), totalPrice * 0.3)
            };
        }

        function updateFinancialIndicators(persist) {
            const totals = getPlanningTotals();

            const prixInput = document.getElementById('etude-prix');
            if (prixInput) prixInput.value = Math.round(totals.totalPrice * 100) / 100;

            const jehInput = document.getElementById('etude-total-jeh');
            if (jehInput) jehInput.value = Math.round(totals.totalJeh * 100) / 100;

            const fraisInput = document.getElementById('etude-frais');
            if (fraisInput) fraisInput.value = Math.round(totals.frais * 100) / 100;

            currentEtudeData.prix = Math.round(totals.totalPrice * 100) / 100;
            currentEtudeData.fraisEtude = Math.round(totals.frais * 100) / 100;
            currentEtudeData.totalJeh = totals.totalJeh;

            if (persist) {
                saveEtudeInfo();
            }
        }

        function normalizeTodosForUi_(todos) {
            const list = Array.isArray(todos) ? todos : [];
            return list.map((todo, index) => ({
                id: todo && (todo.id || todo.todoId) ? (todo.id || todo.todoId) : (Date.now() + index),
                text: todo && todo.text ? todo.text : '',
                done: !!(todo && todo.done),
                date: todo && todo.date ? todo.date : ''
            }));
        }

        function normalizePhasesForUi_(phases) {
            const list = Array.isArray(phases) ? phases : [];
            return list.map((phase, index) => ({
                id: phase && (phase.id || phase.phaseId) ? (phase.id || phase.phaseId) : (Date.now() + index),
                title: phase && phase.title ? phase.title : 'Nouvelle phase',
                description: phase && phase.description ? phase.description : '',
                start: Math.max(1, toNumber(phase && phase.start, 1)),
                duration: Math.max(1, toNumber(phase && phase.duration, 1)),
                jeh: Math.max(0, toNumber(phase && phase.jeh, 0)),
                priceJeh: Math.max(0, Math.min(450, toNumber(phase && phase.priceJeh, 0))),
                done: !!(phase && phase.done)
            }));
        }

        function loadStudySectionsOnDemand_(sections) {
            if (!currentStudyId) return;

            const requested = Array.isArray(sections) ? sections : [];
            const missing = requested.filter(section => !studySectionsLoaded[section]);
            if (missing.length === 0) return;

            if (missing.includes('planning')) {
                renderPlanningLoadingState();
            }

            google.script.run
                .withSuccessHandler(function(payload) {
                    if (!payload || typeof payload !== 'object') return;

                    if (missing.includes('todos') && Array.isArray(payload.todos)) {
                        currentTodos = normalizeTodosForUi_(payload.todos);
                        renderTodos();
                        studySectionsLoaded.todos = true;
                    }

                    if (missing.includes('planning') && payload.planning) {
                        currentPhases = normalizePhasesForUi_(payload.planning.phases || []);
                        const start = payload.planning.startDate || '';
                        if (start) {
                            const planningStartInput = document.getElementById('planning-start-date');
                            if (planningStartInput) planningStartInput.value = start;
                        }
                        renderPlanning();
                        studySectionsLoaded.planning = true;
                    }

                    if (missing.includes('devis') && payload.devisStatus && typeof payload.devisStatus === 'object') {
                        devisState = Object.assign({ loaded: true }, payload.devisStatus);
                        renderDevisActions();
                        studySectionsLoaded.devis = true;
                    }
                    if (missing.includes('cdc') && payload.cdcStatus && typeof payload.cdcStatus === 'object') {
                        cdcState = Object.assign({ loaded: true }, payload.cdcStatus);
                        updateCdcButtons();
                        studySectionsLoaded.cdc = true;
                    }

                    if (missing.includes('categories') && Array.isArray(payload.categories)) {
                        existingEtudeCategories = normalizeEtudeCategories(payload.categories);
                        renderEtudeCategories();
                        studySectionsLoaded.categories = true;
                    }

                    syncStatusFromProgression_();
                })
                .withFailureHandler(function(err) {
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'obtenirSectionsEtude',
                        userMessage: 'Le chargement des sections complémentaires a échoué.',
                        silent: true
                    });
                })
                .obtenirSectionsEtude(currentStudyId, missing);
        }

            currentStudyId = studyId;

            if(!study) { alert("Erreur interne: Etude introuvable"); return; }

            document.getElementById('etude-id-badge').textContent = study.id; // Hidden but used for logic

            // 3. Switch View
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-tasks').classList.add('hidden');
            document.getElementById('view-erp-settings').classList.add('hidden');
            document.getElementById('view-etude').classList.remove('hidden');

            // 4. Load Dynamic Data
            const errorDiv = document.getElementById('etude-details-error');

            errorDiv.classList.add('hidden');
            
            // Reset Fields
            if (quillDescription) quillDescription.root.innerHTML = '';
            if (quillContexte) quillContexte.root.innerHTML = '';
            if (quillProblematique) quillProblematique.root.innerHTML = '';
            const titreEl = document.getElementById('etude-titre');
            if (titreEl) titreEl.value = '';
            currentTodos = [];
            currentEtudeData = {};
            studySectionsLoaded = { overview: false, todos: false, planning: false, devis: false, cdc: false, negociation: false, categories: false, realisationDocs: false };
            avantProjetSteps = { client: {}, interv: {} };
            negociationStepStates = { client: {}, interv: {} };
            currentClientInfo = getDefaultClientInfo();
            currentIntervenantInfo = getDefaultIntervenantInfo();
            meetingHistoryEntries = [];
            currentRealisationSubtab = 'suivis';
            _resetDevisState();
            _resetCdcState();
            resetNegociationDocStates_();
            renderEtudeCategories();
            renderTodos();
            renderDevisActions();
            renderNegociationSection();
            renderApSteps();
            renderMeetingFollowups_();
            setDefaultJointMeetingDate_();

            // Switch to overview tab by default
            currentTab = 'overview';
            switchEtudeTab('overview');

            function applyOverviewPayloadNative_(data) {
                const payload = data && typeof data === 'object' ? data : {};

                if (quillDescription) quillDescription.root.innerHTML = payload.Description || '';

                if (payload.Status) {
                    document.getElementById('etude-status-select').value = payload.Status;
                    updateTimelineState(payload.Status);
                } else {
                    updateTimelineState('En cours de réalisation');
                }

                currentEtudeData = payload.EtudeInfo && typeof payload.EtudeInfo === 'object' ? payload.EtudeInfo : {};
                if (!currentEtudeData.nom) currentEtudeData.nom = study.name || '';
                if (!currentEtudeData.reference) currentEtudeData.reference = study.fullRef || (study.year + '_' + study.ref);
                if (typeof payload.progress === 'number' && !Number.isFinite(Number(currentEtudeData.progress))) {
                    currentEtudeData.progress = payload.progress;
                }
                currentClientInfo = normalizeClientInfo(payload.ClientInfo || {});
                loadEtudeInfo();
                loadIntervenantInfoFromEtude_();
                loadMeetingHistoryFromEtude_();
                renderMeetingFollowups_();
                
                const rawNegociationSteps = parseJsonObjectSafe_(payload.Negociation_Steps, { client: {}, interv: {} });
                negociationStepStates = rawNegociationSteps && typeof rawNegociationSteps === 'object'
                    ? rawNegociationSteps
                    : { client: {}, interv: {} };
                
                renderNegociationSection();
                renderRealisationDocsSection();

                const rawAvantProjetSteps = parseJsonObjectSafe_(payload.AvantProjet_Steps, { client: {}, interv: {} });
                avantProjetSteps = rawAvantProjetSteps && typeof rawAvantProjetSteps === 'object'
                    ? rawAvantProjetSteps
                    : { client: {}, interv: {} };
                renderApSteps();

                const planningStartInput = document.getElementById('planning-start-date');
                if (planningStartInput) {
                    planningStartInput.value = payload.Planning_StartDate || planningStartInput.value || '';
                    if (!planningStartInput.value) planningStartInput.valueAsDate = new Date();
                }

                studySectionsLoaded.overview = true;
                switchRealisationSubtab(currentRealisationSubtab || 'suivis');
                syncStatusFromProgression_();
            }

            const cachedOverview = getStudyOverviewCache_(studyId);
            if (cachedOverview && cachedOverview.updatedAt && study.updatedAt && String(cachedOverview.updatedAt) === String(study.updatedAt) && cachedOverview.payload) {
                try {
                    applyOverviewPayloadNative_(cachedOverview.payload);
                    setEtudeLoadingState(false);
                    syncStatusFromProgression_();
                    switchEtudeTab(resolveInitialStudyTab_());
                    return;
                } catch (eCache) {
                    console.warn('Cache overview invalide, fallback backend:', eCache);
                }
            }

            google.script.run
                .withSuccessHandler(function(response) {
                    try {
                        const data = (response && typeof response === 'object') ? response : {};
                        applyOverviewPayloadNative_(data);
                        setStudyOverviewCache_(studyId, data.updatedAt || study.updatedAt || '', data);
                    } catch (e) {
                        handleUiError_(e, {
                            source: 'frontend',
                            location: 'showStudy/renderDetails',
                            userMessage: 'Erreur lors du rendu des détails de l\'étude.'
                        });
                    } finally {
                        setEtudeLoadingState(false);
                        syncStatusFromProgression_();
                        switchEtudeTab(resolveInitialStudyTab_());
                    }
                })
                .withFailureHandler(function(err) {
                    setEtudeLoadingState(false);
                    errorDiv.classList.remove('hidden');
                    document.getElementById('etude-details-error-msg').textContent = (err && err.message) ? err.message : String(err || 'Erreur inconnue');
                    handleUiError_(err, {
                        source: 'google.script.run',
                        location: 'obtenirOverviewEtude',
                        userMessage: 'Impossible de charger les détails de l\'étude.'
                    });
                })
                .obtenirOverviewEtude(studyId);
        }

        function setDefaultJointMeetingDate_() {
            const input = document.getElementById('joint-meeting-datetime');
            if (!input || input.value) return;
            const d = new Date();
            d.setDate(d.getDate() + 1);
            d.setHours(10, 0, 0, 0);
            const pad = function(v) { return String(v).padStart(2, '0'); };
            input.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function mapStatusToTab_(status) {
            if (status === 'Besoin identifié') return 'avant-projet';
            if (status === 'Négotiation') return 'negociation';
            if (status === 'Etude signée' || status === 'En cours de réalisation') return 'realisation';
            if (status === 'Terminée') return 'retribution';
            if (status === 'Stand by' || status === 'Echec') return currentTab || 'overview';
            return 'overview';
        }

            return negociationDocStates[docKey] || createEmptyWorkflowDocState_();

        function isWorkflowValidated_(docKey) {
            return !!(getWorkflowState_(docKey).hasValide);
        }

        function isWorkflowStarted_(docKey) {
            const s = getWorkflowState_(docKey);
            return !!(s.hasDraft || s.hasPdf || s.hasValide);
        }

        function isAvantProjetComplete_() {
            const groups = ['client', 'interv'];
            for (let g = 0; g < groups.length; g++) {
                const group = groups[g];
                for (let i = 1; i <= 4; i++) {
                    if (!(avantProjetSteps[group] && avantProjetSteps[group][i])) return false;
                }
            }
            return true;
        }

        function getRequiredClientNegociationDocKeys_() {
            const mode = getNegociationClientMode_();
            if (mode === 'ce') return ['ce'];
            if (mode === 'cc_bdc') return ['cc', 'bdc'];
            return [];
        }

        function isNegociationComplete_() {
            const requiredClientDocs = getRequiredClientNegociationDocKeys_();
            if (!requiredClientDocs.length) return false;

            const requiredDocs = requiredClientDocs.concat(['rm']);
            const allLoaded = requiredDocs.every(function(key) {
                return !!getWorkflowState_(key).loaded;
            });
            if (!allLoaded) {
                const status = getCurrentStatusValue_();
                return status === 'Etude signée' || status === 'En cours de réalisation' || status === 'Terminée';
            }

            const clientDocsDone = requiredClientDocs.every(function(key) { return isWorkflowValidated_(key); });
            const rmDone = isWorkflowValidated_('rm');
            const clientChecklistDone = isNegociationChecklistDone_('client');
            const intervChecklistDone = isNegociationChecklistDone_('interv');

            const clientSideDone = clientDocsDone || clientChecklistDone;
            const intervSideDone = rmDone || intervChecklistDone;
            return clientSideDone && intervSideDone;
        }

        function getRequiredRealisationDocKeys_() {
            return getRealisationDocKeys_();
        }

        function isPlanningStarted_() {
            return Array.isArray(currentPhases) && currentPhases.length > 0;
        }

        function isPlanningComplete_() {
            return isPlanningStarted_() && currentPhases.every(function(phase) { return !!phase.done; });
        }

        function hasRealisationStarted_() {
            const keys = getRequiredRealisationDocKeys_();
            if (!keys.length) return false;

            const allLoaded = keys.every(function(key) { return !!getWorkflowState_(key).loaded; });
            if (!allLoaded) {
                const status = getCurrentStatusValue_();
                if (status === 'En cours de réalisation' || status === 'Terminée') return true;
            }

            const docsStarted = keys.some(function(key) { return isWorkflowStarted_(key); });
            return docsStarted || isPlanningStarted_();
        }

        function isRealisationComplete_() {
            const keys = getRequiredRealisationDocKeys_();
            if (!keys.length) return false;

            const allLoaded = keys.every(function(key) { return !!getWorkflowState_(key).loaded; });
            if (!allLoaded) {
                return getCurrentStatusValue_() === 'Terminée';
            }

            const docsDone = keys.every(function(key) { return isWorkflowValidated_(key); });
            return docsDone && isPlanningComplete_();
        }

        function computeAutoStatusFromProgression_() {
            if (!isAvantProjetComplete_()) return 'Besoin identifié';
            if (!isNegociationComplete_()) return 'Négotiation';
            if (isRealisationComplete_()) return 'Terminée';
            if (hasRealisationStarted_()) return 'En cours de réalisation';
            return 'Etude signée';
        }

        function resolveInitialStudyTab_() {
            if (!isAvantProjetComplete_()) return 'avant-projet';
            const status = getCurrentStatusValue_();
            return mapStatusToTab_(status);
        }

        function computeProgressFromStatus_(status) {
            let newProgress = parseInt(document.getElementById('etude-progress').value, 10) || 0;
            switch (status) {
                case 'Besoin identifié':
                    newProgress = 5;
                    break;
                case 'Négotiation':
                    newProgress = 15;
                    break;
                case 'Etude signée':
                    newProgress = 30;
                    break;
                case 'En cours de réalisation':
                    if (currentPhases && currentPhases.length > 0) {
                        const total = currentPhases.length;
                        const done = currentPhases.filter(function(p) { return !!p.done; }).length;
                        const phaseProgress = Math.round((done / total) * 70);
                        newProgress = 30 + phaseProgress;
                    } else {
                        newProgress = 30;
                    }
                    break;
                case 'Terminée':
                    newProgress = 100;
                    break;
                default:
                    break;
            }
            return newProgress;
        }

        function syncStatusFromProgression_(force) {
            if (!currentStudyId) return;
            if (isEtudeLoading && !force) return;

            const currentStatus = getCurrentStatusValue_();
            const isLocked = !!currentEtudeData.statusManualLock;
            if (isLocked && !force) {
                updateTimelineState(currentStatus);
                return;
            }

            const targetStatus = computeAutoStatusFromProgression_();
            if (!targetStatus) return;

            if (currentStatus !== targetStatus) {
                const select = document.getElementById('etude-status-select');
                if (select) select.value = targetStatus;
                updateEtudeInfo('progress', computeProgressFromStatus_(targetStatus));
                updateTimelineState(targetStatus);
                scheduleStudySaveFlush();
            google.script.run.enregistrerDonneeEtude(currentStudyId, 'Status', targetStatus);
            } else {
                updateTimelineState(targetStatus);
            }
        }

        function saveStatus() {
            const status = document.getElementById('etude-status-select').value;

            currentEtudeData.statusManualLock = !!STATUS_MANUAL_LOCK_VALUES[status];
            saveEtudeInfo();

            updateEtudeInfo('progress', computeProgressFromStatus_(status));
            updateTimelineState(status);

            scheduleStudySaveFlush();
            google.script.run.enregistrerDonneeEtude(currentStudyId, 'Status', status);
        }

        function updateTimelineState(status) {
            const tabs = ['avant-projet', 'negociation', 'realisation', 'retribution'];
            let activeIndex = -1;

            if (status === "Besoin identifié") activeIndex = 0;
            else if (status === "Négotiation") activeIndex = 1;
            else if (status === "Etude signée" || status === "En cours de réalisation") activeIndex = 2; // Realisation starts after signature
            else if (status === "Terminée") activeIndex = 3;

            // Update timeline UI based on current DOM structure (.timeline-dot + .timeline-connector)
            tabs.forEach((tab, index) => {
                const btn = document.querySelector(`.etude-tab-btn[data-tab="${tab}"]`);
                if (!btn) return;

                const dot = btn.querySelector('.timeline-dot');
                const connector = document.querySelector(`.timeline-connector[data-conn="${index}"]`);

                // Reset button
                btn.classList.remove('opacity-50', 'cursor-not-allowed');

                // Reset dot classes/state
                if (dot) {
                    dot.classList.remove(
                        'bg-white', 'border-gray-300', 'text-gray-400',
                        'bg-indigo-500', 'border-indigo-500', 'text-white',
                        'bg-green-500', 'border-green-500',
                        'timeline-dot-future', 'timeline-dot-active', 'timeline-dot-done'
                    );
                    dot.textContent = String(index + 1);
                }

                if (index < activeIndex) {
                    // Done step
                    if (dot) {
                        dot.classList.add('timeline-dot-done');
                        dot.textContent = '✓';
                    }
                    if (connector) connector.classList.add('bg-green-500');
                } else if (index === activeIndex) {
                    // Current step
                    if (dot) dot.classList.add('timeline-dot-active');
                    if (connector) connector.classList.remove('bg-green-500');
                } else {
                    // Future step
                    if (dot) dot.classList.add('timeline-dot-future');
                    if (connector) connector.classList.remove('bg-green-500');
                }
            });
        }

        function updatePhase(id, key, value) {
            const phase = currentPhases.find(p => String(p.id) === String(id));
            if (phase) {
                if(key === 'start' || key === 'duration' || key === 'jeh') {
                    const parsed = parseInt(value, 10);
                    if (key === 'jeh') {
                        phase[key] = Math.max(0, Number.isFinite(parsed) ? parsed : 0);
                    } else {
                        phase[key] = Math.max(1, Number.isFinite(parsed) ? parsed : 1);
                    }
                } else if (key === 'priceJeh') {
                    const parsedPrice = parseFloat(value);
                    if (!Number.isFinite(parsedPrice) || parsedPrice < 0 || parsedPrice > 450) {
                        alert('Le prix par JEH doit être compris entre 0 et 450.');
                        return;
                    }
                    phase.priceJeh = parsedPrice;
                } else if (key === 'done') {
                    phase[key] = value; // boolean
                } else {
                    phase[key] = value;
                }
                
                renderPlanning(); // Re-render visual chart
                savePlanning();

                if (key === 'done') {
                    calculateAndSaveProgress();
                }
            }
        }

        // --- Drag & Drop Logic ---

        function startDrag(e, id, type) {
            e.preventDefault(); // Prevent text selection
            const phase = currentPhases.find(p => String(p.id) === String(id));
            if(!phase) return;

            // Get width of one week slot
            const grid = e.target.closest('.gantt-grid');
            if (!grid) return;
            const totalWidth = grid.clientWidth;
            const visualMaxWeek = parseInt(grid.getAttribute('data-visual-max-week'), 10) || 12;
            if (!totalWidth || visualMaxWeek <= 0) return;
            
            const pxPerWeek = totalWidth / visualMaxWeek;

            dragInfo = {
                id: id,
                type: type, // 'move' or 'resize'
                startX: e.clientX,
                originalStart: parseInt(phase.start) || 1,
                originalDuration: parseInt(phase.duration) || 1,
                pxPerWeek: pxPerWeek
            };
        }

        function onDragMove(e) {
            if (!dragInfo) return;

            const deltaPx = e.clientX - dragInfo.startX;
            const deltaWeeks = Math.round(deltaPx / dragInfo.pxPerWeek);
            
            const phase = currentPhases.find(p => String(p.id) === String(dragInfo.id));
            if (!phase) return;

            let changed = false;

            if (dragInfo.type === 'move') {
                const newStart = dragInfo.originalStart + deltaWeeks;
                if (newStart >= 1 && newStart !== (parseInt(phase.start, 10) || 1)) {
                    phase.start = newStart;
                    changed = true;
                }
            } else if (dragInfo.type === 'resize') {
                const newDuration = dragInfo.originalDuration + deltaWeeks;
                if (newDuration >= 1 && newDuration !== (parseInt(phase.duration, 10) || 1)) {
                    phase.duration = newDuration;
                    changed = true;
                }
            }

            if (changed) {
                schedulePlanningRender(true); // Live update (batched, no financial recompute)
            }
        }

        function onDragEnd(e) {
            if (dragInfo) {
                if (planningRenderRafId) {
                    cancelAnimationFrame(planningRenderRafId);
                    planningRenderRafId = null;
                    planningRenderSkipFinancials = false;
                }
                renderPlanning();
                dragInfo = null;
                savePlanning(); // Save on drop
            }
        }

                const defaultTitles = [
                    'Point Validation Devis', 'Entretien de sélection', 'Point de rédaction CdC',
                    'Négociation du contrat', 'Soutenance Intermédiaire', 'Soutenance Finale', 'Réunion de Suivi', 'Réunion'

                }

                if (entry.crFileUrl) {
                    actionsHtml += `<a href="${entry.crFileUrl}" target="_blank" class="text-xs bg-green-50 text-green-700 hover:bg-green-100 px-3 py-1.5 rounded-md font-medium inline-flex items-center transition-colors"><i class="fas fa-pen mr-1"></i> Modifier le CR</a>`;
                } else {
                    actionsHtml += `<button id="btn-cr-${entry.id}" onclick="creerOuOuvrirCrReunionGlobale('${entry.id}')" class="text-xs bg-gray-50 border border-gray-200 text-gray-700 hover:bg-gray-100 px-3 py-1.5 rounded-md font-medium inline-flex items-center transition-colors"><i class="fas fa-plus mr-1"></i> Créer CR</button>`;
                }
                
                actionsHtml += `<div class="ml-auto flex items-center">`;
                actionsHtml += `<button onclick="editerReunionGlobale('${entry.id}')" class="text-xs text-gray-500 hover:text-indigo-600 mr-3" title="Modifier la réunion"><i class="fas fa-pen text-sm"></i></button>`;
                actionsHtml += `<button onclick="supprimerReunionGlobale('${entry.id}')" class="text-xs text-red-500 hover:text-red-700" title="Supprimer la réunion"><i class="fas fa-trash text-sm"></i></button>`;
                actionsHtml += `</div>`;
                actionsHtml += `</div>`;

                let indicatorClass = isAvenir ? 'bg-indigo-500' : 'bg-gray-300';

                return `
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 relative overflow-hidden flex flex-col p-4 mb-3">
                    <div class="absolute top-0 left-0 w-1 h-full ${indicatorClass}"></div>
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">${tagLabel}</span>
                            <h5 class="text-sm font-bold text-gray-900">${entry.title || tagLabel || 'Réunion'}</h5>
                        </div>
                        <div class="flex gap-1">${partHtml}</div>
                    </div>
                    <div class="flex items-center gap-4 text-xs text-gray-600 mb-1">
                        <span class="flex items-center"><i class="far fa-calendar mr-1.5 text-gray-400"></i> ${dateStr}</span>
                        <span class="flex items-center"><i class="far fa-clock mr-1.5 text-gray-400"></i> ${timeStr} (${entry.durationMinutes} min)</span>
                    </div>
                    ${entry.meetingLink ? `<p class="mt-2 text-xs text-indigo-700 bg-indigo-50 border border-indigo-100 rounded px-2 py-1.5 truncate"><i class="fas fa-link mr-1.5"></i><a href="${entry.meetingLink}" target="_blank" class="hover:underline">${entry.meetingLink}</a></p>` : ''}
                    ${actionsHtml}
                </div>`;
            };

            avenirList.forEach(e => { htmlAvenir += genererBlocCard(e, true); countAvenir++; });
            histoList.forEach(e => { htmlHisto += genererBlocCard(e, false); countHisto++; });

            if (countAvenir === 0) {
                htmlAvenir = `<div class="text-center py-6 bg-white rounded-lg border border-dashed border-gray-300"><i class="fas fa-calendar-times text-gray-300 text-3xl mb-2"></i><p class="text-sm text-gray-500">Aucune réunion à venir.</p></div>`;
            }
            if (countHisto === 0) {
                htmlHisto = `<div class="text-center py-6 bg-white rounded-lg border border-dashed border-gray-300"><i class="fas fa-history text-gray-300 text-3xl mb-2"></i><p class="text-sm text-gray-500">Aucun historique de réunion.</p></div>`;
            }

            contAvenir.innerHTML = htmlAvenir;
            contHisto.innerHTML = htmlHisto;

            document.getElementById('count-reunions-a-venir').innerText = countAvenir;
            document.getElementById('count-reunions-historique').innerText = countHisto;
        }

        function supprimerReunionGlobale(id) {
            const entry = meetingHistoryEntries.find(e => String(e.id) === String(id));
            let confirmMsg = "Voulez-vous vraiment supprimer cette réunion de l'étude ?";
            if (entry && entry.crFileId) {
                confirmMsg = "Voulez-vous vraiment supprimer cette réunion de l'étude ?\n\n⚠️ ATTENTION : Le compte-rendu associé sera définitivement supprimé de Google Drive.";
            }

            if (confirm(confirmMsg)) {
                if (entry && entry.crFileId && typeof google !== 'undefined' && google.script) {
                    google.script.run.withFailureHandler(err => {
                        console.error('Erreur lors de la suppression du fichier CR :', err);
                        alert('La réunion a été supprimée, mais une erreur est survenue lors de la suppression du fichier Drive : ' + err);
                    }).supprimerFichierDrive(entry.crFileId);
                }

                if (currentEditReunionId === id) {
                    annulerEditionReunionGlobale();
                }
                
                // Supprime directement du tableau pour éviter la double modal confirmation
                const idx = meetingHistoryEntries.findIndex(e => String(e.id) === String(id));
                if (idx >= 0) {
                    meetingHistoryEntries.splice(idx, 1);
                    if (typeof queueSaveMeetingHistory_ === 'function') queueSaveMeetingHistory_();
                    if (typeof syncStatusFromProgression_ === 'function') syncStatusFromProgression_();
                    if (typeof renderMeetingFollowups_ === 'function') renderMeetingFollowups_();
                }
                
                setTimeout(() => renderReunionsGlobale(), 300);
            }
        }

        let quillContexte, quillProblematique, quillDescription, quillPhase, quillClientDesc;

        function initQuillEditors() {
            const quillOptions = {
                theme: 'snow',
                modules: {
                    toolbar: [
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ]
                }
            };
            
            quillContexte = new Quill('#etude-contexte', quillOptions);
            quillContexte.on('text-change', function(delta, oldDelta, source) {
                if (source === 'user') {
                    mettreAJourInfoEtude('contexte', quillContexte.root.innerHTML);
                }
            });

            quillProblematique = new Quill('#etude-problematique', quillOptions);
            quillProblematique.on('text-change', function(delta, oldDelta, source) {
                if (source === 'user') {
                    mettreAJourInfoEtude('problematique', quillProblematique.root.innerHTML);
                }
            });

            quillDescription = new Quill('#etude-description', quillOptions);
            quillDescription.on('text-change', function(delta, oldDelta, source) {
                if (source === 'user') {
                    document.getElementById('btn-save-desc').classList.remove('opacity-0');
                }
            });

            quillPhase = new Quill('#phase-editor-description', {
                theme: 'snow',
                modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }]] }
            });
        }

        function initClientQuill() {
            if (document.getElementById('client-description-editor')) {
                quillClientDesc = new Quill('#client-description-editor', {
                    theme: 'snow',
                    modules: { toolbar: [['bold', 'italic', 'underline'], [{ 'list': 'ordered'}, { 'list': 'bullet' }]] }
                });
                if (currentClientInfo && currentClientInfo.description) {
                    quillClientDesc.root.innerHTML = currentClientInfo.description;
                }
                quillClientDesc.on('text-change', function(delta, oldDelta, source) {
                    if (source === 'user') {
                        mettreAJourChampInfoClient('description', quillClientDesc.root.innerHTML);
                    }
                });
            }
        }

        // Initialize empty Quill editors on load
        window.addEventListener('DOMContentLoaded', () => {
            initQuillEditors();
        });

    </script>
</body>
</html>
